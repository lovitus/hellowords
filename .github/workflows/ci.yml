name: Verify garden word movement
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product candidate commit
        type: string
        required: true
      recipient:
        description: Public diagnostic recipient certificate
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  WRANGLER_LOG_PATH: .wrangler/wrangler.log
  PREVIOUS: 6c8ae1d2db672310ec4cd35321ca423512a5266c
  PRODUCT: ${{ inputs.product }}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/observations"
          cp scripts/check-garden-slots.mjs "$RUNNER_TEMP/"
          cp tests/e2e/label-zoom-retention.spec.ts "$RUNNER_TEMP/observed-garden.spec.ts"
          cp tests/e2e/apartment-wheel-settle.spec.ts "$RUNNER_TEMP/"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.product }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check types and placement contracts
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$PREVIOUS"
          npm run typecheck
          ./node_modules/.bin/tsx --test tests/domain/labelPlacement.test.ts
      - name: Compare 12 deterministic garden zoom paths and the recorded seed-plug inputs
        id: compare_layout
        continue-on-error: true
        run: |
          report="$RUNNER_TEMP/observations/garden-slots.json"
          previous="$RUNNER_TEMP/previousPlacement.ts"
          git show "$PREVIOUS:app/domain/labelPlacement.ts" > "$previous"
          status=0
          ./node_modules/.bin/tsx "$RUNNER_TEMP/check-garden-slots.mjs" \
            --old "$previous" --new app/domain/labelPlacement.ts --output "$report" \
            > "$RUNNER_TEMP/observations/garden-slots-summary.json" \
            2> "$RUNNER_TEMP/observations/garden-slots.stderr" || status=$?
          if ! test -s "$report"; then
            jq -n --argjson code "$status" \
              '{status:"error", pass:false, processExit:$code, error:"No completed geometry report"}' > "$report"
            exit 1
          fi
          if test "$status" -ne 0; then exit "$status"; fi
          jq -e '.status == "passed" and .pass == true and (.schedules | length) == 12
            and .seed.oldJump > 120 and .seed.targetVisible and .seed.newJump <= 120 and .seed.geometryPass
            and (.seed.lost | length) == 0' "$report" > /dev/null
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.PREVIOUS }}
          run-id: 45666789444
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Measure the preceding build on this machine
        env:
          PERF_SOURCE_SHA: ${{ env.PREVIOUS }}
          PERF_SCENE_CYCLES: "20"
          PERF_RUN: "1"
        run: |
          jq -e --arg sha "$PREVIOUS" '.gitSha == $sha' "$RUNNER_TEMP/prior/artifacts/build/dist-manifest.json"
          mv "$RUNNER_TEMP/prior/dist" dist
          baseline=0
          npm run test:perf -- --grep 'scene slices stay within CPU and memory budgets' || baseline=$?
          jq -e --arg sha "$PREVIOUS" '.gitSha == $sha and .result.transitions == 40' artifacts/perf/summary.json
          mv artifacts/perf "$RUNNER_TEMP/observations/baseline"
          echo "Previous build performance exit code $baseline" >> "$GITHUB_STEP_SUMMARY"
      - id: old_camera
        name: Record the previous apartment camera after two separate wheel gestures
        continue-on-error: true
        env:
          CAMERA_OBSERVATIONS: ${{ runner.temp }}/observations/camera-before
        run: |
          cp "$RUNNER_TEMP/apartment-wheel-settle.spec.ts" tests/e2e/
          ./node_modules/.bin/playwright test tests/e2e/apartment-wheel-settle.spec.ts --project=chromium --project=mobile-chromium --retries=0
      - name: Build the candidate
        run: |
          mv dist "$RUNNER_TEMP/prior/dist"
          GITHUB_SHA="$PRODUCT" npm run build
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha' artifacts/build/dist-manifest.json
      - uses: actions/upload-artifact@v5
        with:
          name: production-dist-${{ inputs.product }}
          path: |
            dist
            artifacts/build/dist-manifest.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
      - id: measure
        name: Measure candidate for 20 uninstrumented round trips
        continue-on-error: true
        env:
          PERF_RUN: "1"
          PERF_SCENE_CYCLES: "20"
          PERF_SOURCE_SHA: ${{ inputs.product }}
        run: |
          npm run test:perf -- --grep 'scene slices stay within CPU and memory budgets'
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha and .result.transitions == 40' artifacts/perf/summary.json > /dev/null
      - id: new_camera
        name: Record the candidate apartment camera for the same gestures
        continue-on-error: true
        env:
          CAMERA_OBSERVATIONS: ${{ runner.temp }}/observations/camera-after
        run: |
          ./node_modules/.bin/playwright test tests/e2e/apartment-wheel-settle.spec.ts --project=chromium --project=mobile-chromium --retries=0
          for device in chromium mobile-chromium; do
            jq -es 'map([.input, .viewport, .dpr, .initial.camera, .final.camera, .firstScene, .secondScene]) | .[0] == .[1]' \
              "$RUNNER_TEMP/observations/camera-before/$device.json" "$CAMERA_OBSERVATIONS/$device.json"
          done
      - id: interactions
        name: Exercise actual keyboard, pointer and zoom behavior
        continue-on-error: true
        env:
          PERF_SOURCE_SHA: ${{ inputs.product }}
        run: |
          cp "$RUNNER_TEMP/observed-garden.spec.ts" tests/e2e/label-zoom-retention.spec.ts
          ./node_modules/.bin/playwright test --project=chromium --project=mobile-chromium --retries=0 --grep 'oak-tree fit fills|continuous zoom retains grounded|ordinary scenes hide the progress|five authored LOD bands|the apartment minimap reveals|the home atlas keeps its artwork|Apartment handoff settles|continued zoom at a terminal|the Apartment minimap focuses|plant cell exposes its organelle'
          jq -e --arg sha "$PRODUCT" '.source == $sha and .scene == "community-garden" and (.frames | length) > 12' artifacts/handoff-observations/garden-0.json > /dev/null
      - name: Encrypt measured evidence
        if: ${{ !cancelled() }}
        env:
          GEOMETRY: ${{ steps.compare_layout.outcome }}
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/observations"
          if ! test -s "$RUNNER_TEMP/observations/garden-slots.json"; then
            jq -n --arg outcome "$GEOMETRY" \
              '{status:"error", pass:false, stepOutcome:$outcome, error:"Geometry report unavailable"}' \
              > "$RUNNER_TEMP/observations/garden-slots.json"
          fi
          if test -d artifacts/perf; then cp -r artifacts/perf "$RUNNER_TEMP/observations/candidate"; fi
          if test -d artifacts/handoff-observations; then cp -r artifacts/handoff-observations "$RUNNER_TEMP/observations/browser-frames"; fi
          if test -f artifacts/e2e/results.json; then cp artifacts/e2e/results.json "$RUNNER_TEMP/observations/interactions.json"; fi
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          tar -C "$RUNNER_TEMP" -czf - observations | openssl cms -encrypt -binary -stream -aes-256-cbc -outform DER -out "$RUNNER_TEMP/comparison.cms" "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: warm-layout-comparison
          path: ${{ runner.temp }}/comparison.cms
          if-no-files-found: error
          retention-days: 7
      - name: Enforce candidate results
        if: ${{ !cancelled() }}
        run: |
          printf 'Garden geometry: %s; candidate performance: %s; browser interactions: %s.\n' \
            "$GEOMETRY" "$PERFORMANCE" "$INTERACTIONS" >> "$GITHUB_STEP_SUMMARY"
          test "$GEOMETRY" = success
          test "$PERFORMANCE" = success
          test "$INTERACTIONS" = success
          test "$BASE_CAMERA" = success
          test "$CANDIDATE_CAMERA" = success
        env:
          GEOMETRY: ${{ steps.compare_layout.outcome }}
          PERFORMANCE: ${{ steps.measure.outcome }}
          INTERACTIONS: ${{ steps.interactions.outcome }}
          BASE_CAMERA: ${{ steps.old_camera.outcome }}
          CANDIDATE_CAMERA: ${{ steps.new_camera.outcome }}
