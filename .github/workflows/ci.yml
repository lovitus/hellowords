name: Verify bilingual photograph labels
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the reviewed product candidate
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: 58d3ccaf703d347e3a8326915d8f4563cc2f746d
  PRODUCT: ${{ inputs.candidate }}
  MANIFEST_SHA256: 4820769ca8a924039a2b01153e374460b1eeb2b9e024b47d196dc74349476190
  ARTIFACT_RUN: "46055404253"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - &control
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - &dependencies
        id: dependencies
        uses: ./.github/actions/product
        with:
          sha: ${{ env.PRODUCT }}
      - &original_product
        uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASELINE }}
          run-id: ${{ env.ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify the original product manifest and every archived file
        id: integrity
        working-directory: product
        run: python ../.github/frozen-display.py baseline-integrity
      - name: Retrieve the archived baseline measurements
        id: original_evidence
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: frozen-display-${{ env.ARTIFACT_RUN }}
          run-id: ${{ env.ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-evidence
      - name: Verify the original performance failures and the check-in counter word collision
        id: baseline
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.original_evidence.outcome == 'success' }}
        continue-on-error: true
        working-directory: product
        run: python ../.github/frozen-display.py baseline-performance
      - name: Verify the spatial vocabulary index in both versions
        id: spatial
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' }}
        continue-on-error: true
        working-directory: product
        run: python ../.github/frozen-display.py spatial
      - name: Build once and verify every candidate file
        id: build
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' }}
        working-directory: product
        run: |
          test ! -e dist
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build > "$RUNNER_TEMP/build-analysis.log" 2>&1
          python ../.github/frozen-display.py candidate-integrity
      - name: Preserve the verified production files for all browser jobs
        id: product_artifact
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - &receipt
        name: Record the outcomes of this job
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB: ${{ github.job }}
        working-directory: .
        run: python .github/frozen-display.py receipt
      - &evidence
        name: Preserve this job's evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: evidence-${{ github.job }}-${{ env.TEST_PROJECT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/frozen-display-evidence
          if-no-files-found: error
          retention-days: 7
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: product
    steps:
      - *control
      - *dependencies
      - name: Lint the product
        id: lint
        continue-on-error: true
        run: python ../.github/frozen-display.py lint
      - name: Typecheck the product
        id: types
        continue-on-error: true
        run: python ../.github/frozen-display.py types
      - name: Run all domain, semantic and lexical unit tests
        id: domain
        continue-on-error: true
        run: python ../.github/frozen-display.py domain
      - name: Validate the complete source and human image reviews
        id: strict
        continue-on-error: true
        run: python ../.github/frozen-display.py strict
      - name: Record structural integrity separately from pending image reviews
        id: structure
        continue-on-error: true
        run: python ../.github/frozen-display.py structure
      - *receipt
      - *evidence
  journeys:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    env:
      TEST_PROJECT: ${{ matrix.project }}
    defaults:
      run:
        working-directory: product
    steps:
      - *control
      - *dependencies
      - *original_product
      - &browser
        name: Install the locked Chromium
        id: browser
        run: ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1
      - name: Read the long elevator button in the archived build
        id: misplaced
        continue-on-error: true
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/frozen-browser.py baseline
      - &candidate_product
        name: Retrieve the single verified candidate build
        uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: product
      - name: Read the elevator and existing photographed journeys
        id: journeys
        continue-on-error: true
        run: python ../.github/frozen-browser.py candidate
      - *receipt
      - *evidence
  performance:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: product
    steps:
      - *control
      - *dependencies
      - *candidate_product
      - *browser
      - name: Measure the original 40 navigation transitions and unchanged budgets
        id: navigation
        continue-on-error: true
        run: python ../.github/frozen-display.py navigation
      - *receipt
      - *evidence
  acceptance:
    needs: [build, quality, journeys, performance]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *control
      - name: Collect evidence from every independent job
        uses: actions/download-artifact@v5
        with:
          pattern: evidence-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/frozen-display-evidence
      - name: Aggregate the required jobs and both device reports
        env:
          JOBS: ${{ toJSON(needs) }}
        run: python .github/frozen-display.py record
      - name: Retain the final results including any failed checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: frozen-display-${{ github.run_id }}
          path: ${{ runner.temp }}/frozen-display-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require every gate to pass
        if: ${{ !cancelled() }}
        run: jq -e '.passed' "$RUNNER_TEMP/frozen-display-evidence/result.json"
