name: Verify office break room coffee and tea station exploration
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full product commit SHA
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: 4265fe0c1abcb05d9af1752638543208a33bce02
  PRODUCT: ${{ inputs.candidate }}
jobs:
  drinks:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASELINE }}
          run-id: "45958053422"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify sources and frozen production files
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASELINE"
          test "$(sha256sum "$RUNNER_TEMP/frozen/artifacts/build/dist-manifest.json" | cut -d' ' -f1)" = b0fa291d0f89eaca258f8d8335034fb892fab64ad6795ad860f6fc85daeb5550
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/frozen" "$BASELINE"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install pinned dependencies and Chromium
        run: |
          npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Reproduce magnifying the coffee maker and tea packet on the frozen break room photograph
        id: red
        continue-on-error: true
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/check-office-drinks.py baseline
      - name: Validate the candidate vocabulary and pending image reviews
        run: npm run validate:data -- --allow-image-reviewed
      - name: Typecheck and lint changed code
        run: |
          npm run typecheck
          git diff --name-only --diff-filter=ACMR -z "$BASELINE" "$PRODUCT" -- '*.ts' '*.tsx' '*.mjs' | xargs -0r ./node_modules/.bin/eslint --
      - name: Build the frozen candidate once and verify the manifest
        id: build
        run: |
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          python ../.github/verify-office-phone.py manifest . "$PRODUCT"
      - name: Verify four office photographs and follow the drink station, refrigerator and atrium journeys
        run: python ../.github/check-office-drinks.py candidate
      - name: Run the affected scene contracts and all vocabulary checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          {
            printf '%s\n' tests/domain/newFacilityScenes.test.ts tests/domain/sceneVisualQuality.test.ts tests/domain/worldContent.test.ts
            git diff --name-only --diff-filter=ACMR "$BASELINE" "$PRODUCT" -- 'tests/domain/*.test.ts'
          } | sort -u | xargs ./node_modules/.bin/tsx --test
          node --test tests/semantic/*.test.mjs tests/lexical-world/*.test.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: office-drink-stations-${{ github.run_id }}
          path: ${{ runner.temp }}/office-drinks-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require both original station entrance failures on both viewports
        run: test "$RED_OUTCOME" = success
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
