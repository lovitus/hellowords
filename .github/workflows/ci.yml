name: Diagnose the frozen mobile baggage service return
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Frozen cabin product SHA from the original hosted run
        type: string
        required: true
        default: 57402fb3787ffdabde34ce3d2355a63a2853d4fe
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: 693ad9a81b2842f5dc2ab2c02b71cd7a2f02174d
  PRODUCT: ${{ inputs.candidate }}
jobs:
  baggage-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 57402fb3787ffdabde34ce3d2355a63a2853d4fe
          fetch-depth: 2
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-57402fb3787ffdabde34ce3d2355a63a2853d4fe
          run-id: "45950843653"
          github-token: ${{ github.token }}
          path: product
      - uses: actions/download-artifact@v5
        with:
          name: passenger-seat-meal-45950843653
          run-id: "45950843653"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-cabin
      - name: Verify the original production files, baseline and five passed journeys
        run: |
          test "$PRODUCT" = 57402fb3787ffdabde34ce3d2355a63a2853d4fe
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASELINE"
          echo '4bf2cbb16b9fa91ace6b0668668cf045bb5351742705bb85b4418551c451bd98  artifacts/build/dist-manifest.json' | sha256sum -c -
          python ../.github/verify-office-phone.py manifest . "$PRODUCT"
          cd "$RUNNER_TEMP/prior-cabin"
          sha256sum -c <<'RECEIPTS'
          12dc7495e3b72e9d6d199eef12141e3cfd12ded7587b966e902498783c0c0b3f  baseline.json
          4bbba172ed6a40df2ee34f412c9269325ab2630a725aa27e955929f030e8568b  candidate.json
          RECEIPTS
          python "$GITHUB_WORKSPACE/.github/check-cabin-meal.py" prior
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install pinned browser dependencies
        run: |
          npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Run the original mobile baggage journey once on the original files
        run: python ../.github/check-cabin-meal.py mobile-baggage
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: mobile-baggage-return-${{ github.run_id }}
          path: ${{ runner.temp }}/baggage-diagnostic
          if-no-files-found: error
          retention-days: 7
