name: Verify departing word layers on the frozen hospital build
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full product commit SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  BUILT: d19dbe3577131a6f1507ac18098f30edb5ae6deb
  PRODUCT: ${{ inputs.candidate }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BUILT }}
          run-id: "45935682978"
          github-token: ${{ github.token }}
          path: product
      - name: Verify the identical product tree and frozen build
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          git diff --exit-code "$BUILT" HEAD -- . ':!tests/domain/screenSpaceLabels.test.ts' ':!postponed-tasks.md'
          test "$(sha256sum artifacts/build/dist-manifest.json | cut -d' ' -f1)" = 1ac352aa7e86bcd29548efa00134107cbb699b48eeb604d190e342e737a425bd
          python ../.github/verify-office-phone.py manifest . "$BUILT"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Verify the assertion catches departing buttons when their suppression is removed
        run: |
          trap 'git restore -- app/components/SceneViewport.tsx' EXIT
          python - <<'PY'
          from pathlib import Path
          p = Path("app/components/SceneViewport.tsx")
          text = p.read_text()
          guard = '    if (transitionPhase === "outgoing") return [];\n'
          assert text.count(guard) == 1
          p.write_text(text.replace(guard, ""))
          PY
          if ./node_modules/.bin/tsx --test --test-name-pattern='dense scenes render' tests/domain/screenSpaceLabels.test.ts > "$RUNNER_TEMP/red.log" 2>&1; then exit 1; fi
          grep -F "the departing scene cannot contribute an old word button" "$RUNNER_TEMP/red.log" >/dev/null
      - name: Check the restored word layer, types, and vocabulary suites
        run: |
          git diff --exit-code
          npm run typecheck
          ./node_modules/.bin/eslint tests/domain/screenSpaceLabels.test.ts
          ./node_modules/.bin/tsx --test tests/domain/screenSpaceLabels.test.ts
          node --test tests/semantic/*.test.mjs tests/lexical-world/*.test.mjs
      - name: Exercise district hover and keyboard focus on the frozen production files
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          h = runpy.run_path("../.github/verify-office-phone.py")
          temp = Path(os.environ["RUNNER_TEMP"])
          cases = [(project, "e2e/world.spec.ts", title)
                   for project in ("chromium", "mobile-chromium")
                   for title in ("the home atlas keeps its artwork clear and reveals only the hovered district words",
                                 "home atlas district journey keyboard tabs from the Campus title to a drawn word and back")]
          h["run_browser"]("supplement", temp, cases)
          folder = temp / "supplement"
          data = json.loads((folder / "results.json").read_bytes())
          outcomes = [(key, [r["status"] for r in test["results"]])
                      for suite in data["suites"] for key, test in h["report_cases"](suite)]
          print(json.dumps(outcomes))
          assert not data["errors"] and sorted(key for key, _ in outcomes) == sorted(cases)
          assert all(status == ["passed"] for _, status in outcomes) and (folder / "exit").read_text().strip() == "0"
          PY
