name: CI
on: workflow_dispatch

permissions:
  contents: read
  actions: read

env:
  CI: "true"
  WRANGLER_LOG_PATH: .wrangler/wrangler.log

jobs:
  baseline:
    name: Reproduce ${{ matrix.baseline }} regressions on the historical product
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: reading
            ref: 0382df2e84ac74303ce21c8f3473b1d360ec61d4
            pattern: long words and definitions fit|ordinary scenes hide
          - baseline: navigation
            ref: 04c23d841122187284d13c8bc728db56598ad748
            pattern: the Apartment minimap|reduced motion commits the child
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Use the candidate's browser assertions against the historical app
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" -- tests/e2e
      - if: matrix.baseline == 'reading'
        run: npm run build
      - if: matrix.baseline == 'navigation'
        uses: actions/download-artifact@v5
        with:
          name: verification-04c23d841122187284d13c8bc728db56598ad748
          run-id: 45651079784
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-build
      - if: matrix.baseline == 'navigation'
        run: cp -R "$RUNNER_TEMP/previous-build/dist" dist
      - name: Exercise the actual production server
        env:
          PATTERN: ${{ matrix.pattern }}
        run: |
          if npx playwright test tests/e2e/semantic-density.spec.ts tests/e2e/label-zoom-retention.spec.ts tests/e2e/scene-minimap.spec.ts tests/e2e/continuous-semantic-zoom.spec.ts --grep="$PATTERN" --project=chromium --project=mobile-chromium --workers=1 --retries=0; then
            echo "Expected at least one observable regression against this baseline."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, appendFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("artifacts/e2e/results.json", "utf8"));
          const flatten = suite => [...(suite.specs ?? []), ...(suite.suites ?? []).flatMap(flatten)];
          const specs = flatten(report);
          const checks = process.env.PATTERN.startsWith("long") ? [
            ["long words and definitions fit", "mobile-chromium", /General Communication must contain|vt\.|vi\.|full search definition must fit|word card title must show/],
            ["ordinary scenes hide", "chromium", /toBeHidden/],
          ] : [
            ["the Apartment minimap", "mobile-chromium", /the full name "(?:Stair entrance|Bedroom|Bathroom)" must fit/],
            ["reduced motion commits the child", "chromium", /a fresh outward gesture at the minimum returns to the parent/],
          ];
          for (const [prefix, project, expected] of checks) {
            const result = specs.filter(spec => spec.title.startsWith(prefix))
              .flatMap(spec => spec.tests).find(test => test.projectName === project)?.results[0];
            assert.ok(result, `Missing baseline test for ${prefix} on ${project}`);
            assert.equal(result.status, "failed", prefix);
            assert.ok(result.errors.some(error => expected.test(error.message)), `${prefix} failed for another reason. See baseline result artifact.`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- Reproduced ${project}: ${prefix}\n`);
          }
          NODE
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: baseline-${{ matrix.baseline }}
          path: artifacts/e2e/results.json
          retention-days: 7
  milestone:
    name: Verify the complete product commit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: product
        run: |
          git checkout --detach HEAD^
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check -- --milestone
      - name: Run the release checks on the exact product commit
        env:
          PERF_SOURCE_SHA: ${{ steps.product.outputs.sha }}
        run: GITHUB_SHA="$PERF_SOURCE_SHA" npm run verify:full
      - name: Collect performance evidence if browser assertions stopped the release checks
        if: failure() && hashFiles('artifacts/e2e/results.json') != '' && hashFiles('artifacts/perf/results.json') == ''
        env:
          PERF_RUN: "1"
          PERF_SOURCE_SHA: ${{ steps.product.outputs.sha }}
        run: npm run test:perf
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: verification-${{ steps.product.outputs.sha }}
          path: |
            artifacts/correctness
            artifacts/build
            artifacts/e2e
            artifacts/perf
            dist
          include-hidden-files: true
          retention-days: 7
