name: Recheck scene cache evidence against the frozen production builds
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the candidate built in run 45808079102
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASE: c0597df07a9714efe986db5876bec67547a76954
  PRODUCT: ${{ inputs.candidate }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          path: product
          persist-credentials: false
      - name: Pin the product, its parent and the exact browser test sources
        id: source
        run: |
          mkdir "$RUNNER_TEMP/diagnosis"
          test "$PRODUCT" = 83c203b3752ea5f95fc6bc952552d8ddddaec6d1
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASE"
          sha256sum tests/e2e/{scene-cache-upgrade.spec,cache-motion.spec,office-conference.spec,photo-journey}.ts \
            > "$RUNNER_TEMP/diagnosis/browser-tests.sha256"
      - uses: actions/download-artifact@v5
        id: previous
        with:
          name: scene-http-cache-45808079102-1
          run-id: 45808079102
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - uses: actions/download-artifact@v5
        id: candidate_dist
        with:
          name: production-dist-${{ env.PRODUCT }}
          run-id: 45808079102
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-build
      - uses: actions/download-artifact@v5
        id: baseline_dist
        with:
          name: production-dist-${{ env.BASE }}
          run-id: 45804971418
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify both production SHAs, inventories and file contents
        id: manifests
        run: |
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/frozen" "$BASE"
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/candidate-build" "$PRODUCT"
          jq '{build:.gitSha,sourceRun:45804971418,files:(.files|length)}' \
            "$RUNNER_TEMP/frozen/artifacts/build/dist-manifest.json" > "$RUNNER_TEMP/diagnosis/baseline-build.json"
          jq '{build:.gitSha,sourceRun:45808079102,files:(.files|length)}' \
            "$RUNNER_TEMP/candidate-build/artifacts/build/dist-manifest.json" > "$RUNNER_TEMP/diagnosis/candidate-build.json"
      - name: Verify the original evidence digest, seven candidate journeys and static and domain checks
        id: candidate_evidence
        run: |
          (
            cd "$RUNNER_TEMP/previous"
            LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum
          ) > "$RUNNER_TEMP/diagnosis/source-evidence.sha256"
          test "$(cut -d ' ' -f 1 "$RUNNER_TEMP/diagnosis/source-evidence.sha256")" \
            = 16979fe41885d17f43a4cbb1210a2519462d3314dcb6f7cf28f00d73d8272636
          cmp "$RUNNER_TEMP/previous/browser-tests.sha256" "$RUNNER_TEMP/diagnosis/browser-tests.sha256"
          python ../.github/verify-scene-cache.py reuse-candidate
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install the pinned test dependencies
        id: dependencies
        run: npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Install Chromium
        id: chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Reproduce only the desktop and mobile stale translations on the frozen baseline
        id: red
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/verify-scene-cache.py baseline
      - name: Record gate outcomes and missing browser observations
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: python .github/verify-scene-cache.py evidence
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: scene-http-cache-recheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnosis
          if-no-files-found: error
          retention-days: 7
      - name: Require both old-build failures with all screenshots and the original passing candidate evidence
        if: ${{ !cancelled() }}
        run: jq -e '.accepted == true' "$RUNNER_TEMP/diagnosis/summary.json"
