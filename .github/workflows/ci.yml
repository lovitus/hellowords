name: Verify the reception entrance and all twelve office return leaders
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the product commit containing the revised office return case
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASE: 899521c8bcbbfebe68f3c7c83bfd16a5b869a5b1
  PRODUCT: ${{ inputs.candidate }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Require a new full candidate SHA
        working-directory: .
        run: |
          mkdir "$RUNNER_TEMP/diagnosis"
          [[ "$PRODUCT" =~ ^[0-9a-f]{40}$ && "$PRODUCT" != "$BASE" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          path: product
          persist-credentials: false
      - name: Verify the checkout and record the identical browser tests used for both builds
        id: source
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          sha256sum tests/e2e/{office-conference.spec,photo-journey}.ts > "$RUNNER_TEMP/diagnosis/browser-tests.sha256"
      - name: Record the changed files to lint
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!gh auth git-credential' fetch --quiet --no-tags --depth=1 origin "$BASE" \
            > "$RUNNER_TEMP/fetch.log" 2>&1
          git diff --name-only -z --diff-filter=ACMRT "$BASE" "$PRODUCT" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.mts' '*.cts' > "$RUNNER_TEMP/lint-files"
      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install product dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - uses: actions/download-artifact@v5
        id: download
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        with:
          name: production-dist-${{ env.BASE }}
          run-id: 45796779488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify the archived production manifest
        id: baseline_manifest
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        run: |
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/frozen" "$BASE"
          jq '{build:.gitSha,sourceRun:45796779488,files:(.files|length)}' \
            "$RUNNER_TEMP/frozen/artifacts/build/dist-manifest.json" > "$RUNNER_TEMP/diagnosis/baseline-build.json"
      - name: Run the candidate's phone return case against the archived build
        id: red
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.baseline_manifest.outcome == 'success' }}
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/verify-office-leader.py baseline
      - name: Build the candidate once and verify its production manifest
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          test ! -e dist
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build > "$RUNNER_TEMP/analysis.log" 2>&1
          python ../.github/verify-office-phone.py manifest . "$PRODUCT"
      - uses: actions/upload-artifact@v5
        id: production
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Check the return and all four photographed zoom targets on phone and desktop
        id: green
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.build.outcome == 'success' }}
        run: python ../.github/verify-office-leader.py candidate
      - name: Typecheck the candidate
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python ../.github/verify-office-leader.py types
      - name: Lint the changed TypeScript and JavaScript
        id: lint
        if: ${{ !cancelled() && steps.changes.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: python ../.github/verify-office-leader.py lint
      - name: Verify the office and navigation contracts, label placement, layout and canvas interaction
        id: domain
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python ../.github/verify-office-leader.py domain
      - name: Validate scene data
        id: data
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python ../.github/diagnose-office-phone.py data
      - name: Record gate outcomes and missing browser observations
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: python .github/verify-office-leader.py evidence
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: office-reception-leaders-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnosis
          if-no-files-found: error
          retention-days: 7
      - name: Require the counter edge to cross the old reception button and all candidate checks to pass
        if: ${{ !cancelled() }}
        run: jq -e '.accepted == true' "$RUNNER_TEMP/diagnosis/summary.json"
