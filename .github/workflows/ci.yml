name: Verify the office monitor leader after returning to the atrium
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the product commit containing the revised office return case
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASE: ab818088afaca358ea2cb60e9d8a8cfe5aad99c3
  FROZEN: 0c6407d600da8105ca07f3603be04a0d4626934f
  PRODUCT: ${{ inputs.candidate }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Require a new full candidate SHA
        working-directory: .
        run: |
          mkdir "$RUNNER_TEMP/diagnosis"
          [[ "$PRODUCT" =~ ^[0-9a-f]{40}$ && "$PRODUCT" != "$BASE" && "$PRODUCT" != "$FROZEN" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          path: product
          persist-credentials: false
      - name: Verify checkout and record the identical browser test used on both builds
        id: source
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          sha256sum tests/e2e/office-conference.spec.ts > "$RUNNER_TEMP/diagnosis/browser-test.sha256"
      - name: Verify the archived build's source against the baseline
        id: equivalent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!gh auth git-credential' fetch --quiet --no-tags --depth=1 origin "$FROZEN" "$BASE" \
            > "$RUNNER_TEMP/fetch.log" 2>&1
          git diff --quiet "$FROZEN" "$BASE" -- . ':(exclude)tests/e2e/office-conference.spec.ts' \
            ':(exclude)tests/domain/screenSpaceLabels.test.ts' ':(exclude)postponed-tasks.md'
          git diff --name-only "$FROZEN" "$BASE" | jq -Rn '[inputs]' > "$RUNNER_TEMP/diagnosis/baseline-source-diff.json"
      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install product dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - uses: actions/download-artifact@v5
        id: download
        if: ${{ !cancelled() && steps.equivalent.outcome == 'success' }}
        with:
          name: production-dist-${{ env.FROZEN }}
          run-id: 45783267309
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify the archived production manifest
        id: baseline_manifest
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        run: |
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/frozen" "$FROZEN"
          jq --arg base "$BASE" '{baseline:$base,build:.gitSha,sourceRun:45783267309,files:(.files|length)}' \
            "$RUNNER_TEMP/frozen/artifacts/build/dist-manifest.json" > "$RUNNER_TEMP/diagnosis/baseline-build.json"
      - name: Run the candidate's phone return case against the archived build
        id: red
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.baseline_manifest.outcome == 'success' }}
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/verify-office-leader.py baseline
      - name: Build the candidate once and verify its production manifest
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          test ! -e dist
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build > "$RUNNER_TEMP/analysis.log" 2>&1
          python ../.github/verify-office-phone.py manifest . "$PRODUCT"
      - uses: actions/upload-artifact@v5
        id: production
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Run the candidate's phone and desktop office return cases
        id: green
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.build.outcome == 'success' }}
        run: python ../.github/verify-office-leader.py candidate
      - name: Verify label placement, layout, screen-space labels and canvas hit detection
        id: domain
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python ../.github/verify-office-leader.py domain
      - name: Validate scene data
        id: data
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python ../.github/diagnose-office-phone.py data
      - name: Record gate outcomes and missing browser observations
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: python .github/verify-office-leader.py evidence
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: office-monitor-leader-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnosis
          if-no-files-found: error
          retention-days: 7
      - name: Require the specified intersection on the old phone and passing candidate checks
        if: ${{ !cancelled() }}
        run: jq -e '.accepted == true' "$RUNNER_TEMP/diagnosis/summary.json"
