name: Verify airport security photo and return journeys
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full product commit SHA
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: 5f11c5d20908dd1c7bc9b8308c482117838978a2
  PRODUCT: ${{ inputs.candidate }}
jobs:
  airport:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASELINE }}
          run-id: "45929455622"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify sources and frozen production files
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASELINE"
          test "$(sha256sum "$RUNNER_TEMP/frozen/artifacts/build/dist-manifest.json" | cut -d' ' -f1)" = 1732ce581d4a9fe84c73991cdef8d7c55cd9a0e8e2aaa05a391507d6ad3498bf
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/frozen" "$BASELINE"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install pinned dependencies and Chromium
        run: |
          npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Reproduce the shared dot on the floor in both viewports
        id: red
        continue-on-error: true
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/check-airport-kiosk.py baseline
      - name: Validate the candidate vocabulary and pending image reviews
        run: npm run validate:data -- --allow-image-reviewed
      - name: Typecheck, lint and verify the airport scene contracts
        run: |
          npm run typecheck
          git diff --name-only -z "$BASELINE" "$PRODUCT" -- '*.ts' '*.mjs' | xargs -0r ./node_modules/.bin/eslint --
          ./node_modules/.bin/tsx --test tests/domain/{airportSecurityGate,newFacilityScenes,spatialLexemeRealms,checkInCounter,baggageDropStation,worldContent}.test.ts
      - name: Build the frozen candidate once and verify the manifest
        id: build
        run: |
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          python ../.github/verify-office-phone.py manifest . "$PRODUCT"
      - name: Click the checkpoint post and traverse the airport, office and campus journeys
        run: python ../.github/check-airport-kiosk.py candidate
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: airport-photo-${{ github.run_id }}
          path: ${{ runner.temp }}/kiosk-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require the observed old floor dot
        run: test "$RED_OUTCOME" = success
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
