name: Check the reviewed desktop camera cases on the frozen build
on:
  workflow_dispatch:
    inputs:
      reviewed:
        description: Full SHA of the reviewed delivery commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  FROZEN: 0c6407d600da8105ca07f3603be04a0d4626934f
  REVIEWED: ${{ inputs.reviewed }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Require a full reviewed commit
        working-directory: .
        run: '[[ "$REVIEWED" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.reviewed }}
          path: product
          persist-credentials: false
      - name: Compare both source trees outside the two revised tests and their delivery record
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/diagnosis"
          test "$(git rev-parse HEAD)" = "$REVIEWED"
          git -c 'credential.helper=!gh auth git-credential' fetch --quiet --no-tags --depth=1 origin "$FROZEN" \
            > "$RUNNER_TEMP/fetch.log" 2>&1
          git diff --quiet "$FROZEN" "$REVIEWED" -- . ':(exclude)tests/e2e/office-conference.spec.ts' \
            ':(exclude)tests/domain/screenSpaceLabels.test.ts' ':(exclude)postponed-tasks.md'
          git diff --name-only "$FROZEN" "$REVIEWED" | jq -Rn '[inputs]' > "$RUNNER_TEMP/diagnosis/changed-files.json"
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.FROZEN }}
          run-id: 45783267309
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Check all frozen production file names, sizes and digests
        id: artifact
        run: |
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/frozen" "$FROZEN"
          jq --arg reviewed "$REVIEWED" '{reviewed:$reviewed,production:.gitSha,sourceRun:45783267309,files:(.files|length)}' \
            "$RUNNER_TEMP/frozen/artifacts/build/dist-manifest.json" > "$RUNNER_TEMP/diagnosis/build.json"
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install the frozen dependencies
        id: dependencies
        run: npm ci > "$RUNNER_TEMP/npm.log" 2>&1
      - name: Check only the revised screen-space labels file
        id: domain
        run: python ../.github/diagnose-office-phone.py screen-space-labels
      - name: Run just the desktop wheel and apartment handoff cases
        id: desktop
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
          python ../.github/verify-desktop-camera.py
      - name: Record gate outcomes
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/diagnosis"
          jq -n --arg reviewed "$REVIEWED" --arg frozen "$FROZEN" --argjson gates "$RESULTS" \
            '{reviewed:$reviewed,frozen:$frozen,checks:($gates|with_entries(.value=.value.outcome))}' \
            > "$RUNNER_TEMP/diagnosis/summary.json"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: final-desktop-camera-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnosis
          if-no-files-found: error
          retention-days: 7
