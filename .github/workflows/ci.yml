name: Measure scene word rendering and clear the previous frame
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product commit under review
        required: true
        type: string
      recipient:
        description: Public certificate for browser evidence
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  PRODUCT: ${{ inputs.product }}
  BASE: 6ba0d25dbe085849405520e3fd5805053e5949b8
  BASE_RUN: "45741082017"
  WRANGLER_LOG_PATH: .wrangler/wrangler.log
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.product }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Prepare the actual product and matched browser
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASE"
          mkdir -p "$RUNNER_TEMP/evidence"
          npm ci > "$RUNNER_TEMP/evidence/install.log" 2>&1
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/evidence/browser-install.log" 2>&1
          npm run typecheck > "$RUNNER_TEMP/evidence/types.log" 2>&1
          npx eslint app/lib/label-canvas.ts app/components/SceneViewport.tsx tests/e2e/label-zoom-retention.spec.ts > "$RUNNER_TEMP/evidence/lint.log" 2>&1
          npx tsx --test tests/domain/labelCanvasHit.test.ts > "$RUNNER_TEMP/evidence/hit.log" 2>&1
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASE }}
          run-id: ${{ env.BASE_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Measure forty transitions on the preceding production build
        env:
          PERF_RUN: "1"
          PERF_SCENE_CYCLES: "20"
          PERF_SOURCE_SHA: ${{ env.BASE }}
        run: |
          jq -e --arg sha "$BASE" '.gitSha == $sha' "$RUNNER_TEMP/previous/artifacts/build/dist-manifest.json"
          jq -r '.files[] | "\(.sha256)  \(.path)"' "$RUNNER_TEMP/previous/artifacts/build/dist-manifest.json" > "$RUNNER_TEMP/baseline.sha256"
          mv "$RUNNER_TEMP/previous/dist" dist
          (cd dist && sha256sum --quiet --check "$RUNNER_TEMP/baseline.sha256")
          rc=0
          npm run test:perf -- --grep 'scene slices stay within CPU and memory budgets' > "$RUNNER_TEMP/evidence/old-performance.log" 2>&1 || rc=$?
          jq -e --arg sha "$BASE" '.gitSha == $sha and .result.transitions == 40' artifacts/perf/summary.json
          echo "$rc" > "$RUNNER_TEMP/evidence/old-performance.exit"
          mv artifacts/perf "$RUNNER_TEMP/evidence/old-perf"
          mv dist "$RUNNER_TEMP/previous/dist"
      - name: Confirm that dropping the bitmap to zero can leave visible words
        id: regression
        continue-on-error: true
        run: |
          # Restore just the faulty clear in this disposable development preview.
          sed -i 's/^    clearLabelCanvas(canvas);/    releaseLabelCanvas(canvas);/' app/lib/label-canvas.ts
          sed -i 's/npm run start -- --hostname/npm run dev -- --hostname/' playwright.config.ts
          code=0
          npx playwright test tests/e2e/label-zoom-retention.spec.ts --project=chromium --retries=0 --grep 'ordinary scenes hide' > "$RUNNER_TEMP/evidence/red.log" 2>&1 || code=$?
          git restore -- app/lib/label-canvas.ts playwright.config.ts
          mv artifacts/e2e/results.json "$RUNNER_TEMP/evidence/red.json"
          test "$code" = 1
          jq -e '.stats.unexpected == 1 and (.errors | length == 0) and ([.. | objects | select(has("expectedStatus")) | .results[] | [.status, (.errors[0].message | contains("Opening the word index must clear the last visible word frame"))]] == [["failed",true]])' "$RUNNER_TEMP/evidence/red.json"
      - name: Build and identify the unchanged product candidate once
        id: build
        run: |
          git diff --exit-code
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/evidence/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build > "$RUNNER_TEMP/evidence/manifest.log" 2>&1
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha' artifacts/build/dist-manifest.json
          jq -r '.files[] | "\(.sha256)  \(.path)"' artifacts/build/dist-manifest.json > "$RUNNER_TEMP/candidate.sha256"
          (cd dist && sha256sum --quiet --check "$RUNNER_TEMP/candidate.sha256")
          npm run test:ssr > "$RUNNER_TEMP/evidence/ssr.log" 2>&1
      - uses: actions/upload-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            dist
            artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Measure forty transitions on the new build on the same machine
        id: performance
        continue-on-error: true
        env:
          PERF_RUN: "1"
          PERF_SCENE_CYCLES: "20"
          PERF_SOURCE_SHA: ${{ env.PRODUCT }}
        run: |
          rc=0
          npm run test:perf -- --grep 'scene slices stay within CPU and memory budgets' > "$RUNNER_TEMP/evidence/new-performance.log" 2>&1 || rc=$?
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha and .result.transitions == 40' artifacts/perf/summary.json
          mv artifacts/perf "$RUNNER_TEMP/evidence/new-perf"
          exit "$rc"
      - name: Exercise real scene words, zoom, Fit, index, keyboard, and return
        id: interactions
        continue-on-error: true
        run: |
          rc=0
          npx playwright test tests/e2e/{label-zoom-retention,home-kitchen,scene-minimap,cache-motion}.spec.ts \
            --grep 'ordinary scenes hide|oak-tree fit fills|kitchen object anchor stays|the Apartment minimap focuses|root portal click settles apartment|reduced motion and keyboard navigation' \
            --project=chromium --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/evidence/interactions.log" 2>&1 || rc=$?
          mv artifacts/e2e/results.json "$RUNNER_TEMP/evidence/interactions.json"
          exit "$rc"
      - name: Exercise the regular canvas in a browser without offscreen transfer
        id: fallback
        continue-on-error: true
        run: |
          cp tests/e2e/label-zoom-retention.spec.ts tests/e2e/word-surface-fallback.spec.ts
          cat >> tests/e2e/word-surface-fallback.spec.ts <<'TS'
          test.beforeEach(async ({ page }) => {
            await page.addInitScript(() => {
              Object.defineProperty(HTMLCanvasElement.prototype, "transferControlToOffscreen", {value: undefined});
            });
          });
          TS
          rc=0
          npx playwright test tests/e2e/word-surface-fallback.spec.ts --project=chromium --retries=0 --grep 'ordinary scenes hide' > "$RUNNER_TEMP/evidence/fallback.log" 2>&1 || rc=$?
          mv artifacts/e2e/results.json "$RUNNER_TEMP/evidence/fallback.json"
          exit "$rc"
      - name: Keep diagnostic logs private
        if: ${{ !cancelled() }}
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          set -o pipefail
          tar -C "$RUNNER_TEMP" -czf - evidence | openssl cms -encrypt -stream -binary -aes-256-cbc -outform DER -out "$RUNNER_TEMP/evidence.cms" "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: word-surface-evidence
          path: ${{ runner.temp }}/evidence.cms
          if-no-files-found: error
          retention-days: 7
      - name: Enforce the unchanged performance and interaction requirements
        env:
          RED: ${{ steps.regression.outcome }}
          GREEN: ${{ steps.interactions.outcome }}
          FALLBACK: ${{ steps.fallback.outcome }}
          PERF: ${{ steps.performance.outcome }}
        run: |
          printf 'Regression reproduction %s, interactions %s, fallback %s, performance %s\n' "$RED" "$GREEN" "$FALLBACK" "$PERF"
          test "$RED/$GREEN/$FALLBACK/$PERF" = success/success/success/success
