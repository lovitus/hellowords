name: Verify the apartment and kitchen route
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Product commit with the reviewed anchors
        required: true
        type: string
      recipient:
        description: Public certificate for the browser evidence
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  BASE: 60362cdbf115ded9d4c507a505c3ce8606099305
  MOBILE_BASE: 0c135e5532d803dd9cd9d6c155307f56c192a9c4
  PRODUCT: ${{ inputs.candidate }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Prepare the source and browser
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASE"
          npm ci
          ./node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.MOBILE_BASE }}
          run-id: 45684837251
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Reproduce the refrigerator card entering the coffee machine on a phone
        id: baseline
        continue-on-error: true
        run: |
          jq -e --arg sha "$MOBILE_BASE" '.gitSha == $sha' "$RUNNER_TEMP/previous/artifacts/build/dist-manifest.json"
          mv "$RUNNER_TEMP/previous/dist" dist
          code=0
          ./node_modules/.bin/playwright test tests/e2e/home-kitchen.spec.ts --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/evidence/old.log" 2>&1 || code=$?
          mv dist "$RUNNER_TEMP/previous/dist"
          mv artifacts/e2e/results.json "$RUNNER_TEMP/evidence/old.json"
          mv artifacts/e2e/test-results "$RUNNER_TEMP/evidence/old-screens"
          test "$code" -eq 1
          jq -e '.stats.unexpected == 1 and .stats.flaky == 0 and
            ([.suites[].specs[] | select(.file == "e2e/home-kitchen.spec.ts")
              | .tests[] | [.projectName, (.results | map(.status)),
                [.results[0].errors[].message]]]
              | length == 1 and .[0][0] == "mobile-chromium" and .[0][1] == ["failed"] and
                (.[0][2] | length == 1 and (.[0] | contains("reading the refrigerator card must keep the kitchen open")
                and contains("coffee-machine"))))' "$RUNNER_TEMP/evidence/old.json"
      - name: Verify scene contracts
        run: |
          npm run typecheck > "$RUNNER_TEMP/evidence/types.log" 2>&1
          npm run validate:data > "$RUNNER_TEMP/evidence/scene-data.log" 2>&1
          ./node_modules/.bin/tsx --test tests/domain/worldContent.test.ts tests/domain/worldAtlasVisualContract.test.ts tests/domain/sceneVisualQuality.test.ts > "$RUNNER_TEMP/evidence/contracts.log" 2>&1
      - name: Build the candidate once
        run: |
          GITHUB_SHA="$PRODUCT" npm run build
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha' artifacts/build/dist-manifest.json
          npm run test:ssr > "$RUNNER_TEMP/evidence/ssr.log" 2>&1
      - uses: actions/upload-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            dist
            artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Follow the route on desktop and mobile Chromium
        run: |
          ./node_modules/.bin/playwright test tests/e2e/home-kitchen.spec.ts tests/e2e/portal-prefetch.spec.ts \
            tests/e2e/scene-minimap.spec.ts tests/e2e/continuous-semantic-zoom.spec.ts tests/e2e/scene-transition.spec.ts \
            tests/e2e/spatial-semantic-bridge.spec.ts \
            --grep 'kitchen object anchor|apartment reads kitchen data|the Apartment minimap focuses|Apartment handoff settles|wheel entry uses the same continuous tile handoff|zooming into ordinary terrain|continued zoom at a terminal' \
            --project=chromium --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/evidence/new.log" 2>&1
          jq -e '.stats.expected == 13 and .stats.skipped == 1 and .stats.flaky == 0 and
            ([.suites[].specs[] | .title as $title | .tests[] | select(.results[0].status == "skipped") | [$title,.projectName]]
              == [["wheel entry uses the same continuous tile handoff","mobile-chromium"]]) and
            ([.suites[].specs[] | select(.file == "e2e/home-kitchen.spec.ts")
              | .tests[] | [.projectName, (.results | map(.status))]] | sort)
            == [["chromium", ["passed"]], ["mobile-chromium", ["passed"]]]' artifacts/e2e/results.json
      - name: Preserve browser evidence
        if: ${{ !cancelled() }}
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -o pipefail
          if test -f artifacts/e2e/results.json; then cp artifacts/e2e/results.json "$RUNNER_TEMP/evidence/new.json"; fi
          if test -d artifacts/e2e/test-results; then cp -R artifacts/e2e/test-results "$RUNNER_TEMP/evidence/new-screens"; fi
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          tar -C "$RUNNER_TEMP" -czf - evidence | openssl cms -encrypt -stream -binary -aes-256-cbc -outform DER \
            -out "$RUNNER_TEMP/home-route.cms" "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: home-route-evidence
          path: ${{ runner.temp }}/home-route.cms
          if-no-files-found: error
          retention-days: 7
      - name: Require the original mobile navigation failure
        if: ${{ !cancelled() }}
        run: test "${{ steps.baseline.outcome }}" = success
