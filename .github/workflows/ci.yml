name: Warm layout comparison
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product candidate commit
        type: string
        required: true
      recipient:
        description: Public diagnostic recipient certificate
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  WRANGLER_LOG_PATH: .wrangler/wrangler.log
  PREVIOUS: 5927af6bf9d507083a7e56647030625bbdc583b7
  PRODUCT: ${{ inputs.product }}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: cp scripts/compare-layout-samples.mts "$RUNNER_TEMP/"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.product }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check types and placement contracts
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$PREVIOUS"
          npm run typecheck
          npx tsx --test tests/domain/labelPlacement.test.ts
      - name: Replay real scene geometry against its historical implementation
        run: |
          cp "$RUNNER_TEMP/compare-layout-samples.mts" scripts/
          git show "$PREVIOUS:app/domain/labelPlacement.ts" > app/domain/previousPlacement.ts
          mkdir -p "$RUNNER_TEMP/observations"
          npx tsx scripts/compare-layout-samples.mts > "$RUNNER_TEMP/observations/geometry.json"
          jq . "$RUNNER_TEMP/observations/geometry.json"
          rm scripts/compare-layout-samples.mts app/domain/previousPlacement.ts
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-5927af6bf9d507083a7e56647030625bbdc583b7
          run-id: 45664808893
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - run: npx playwright install --with-deps chromium
      - name: Observe baseline for 20 uninstrumented round trips
        env:
          PERF_SOURCE_SHA: ${{ env.PREVIOUS }}
          PERF_SCENE_CYCLES: "20"
          PERF_RUN: "1"
        run: |
          jq -e --arg sha "$PREVIOUS" '.gitSha == $sha' "$RUNNER_TEMP/prior/artifacts/build/dist-manifest.json"
          mv "$RUNNER_TEMP/prior/dist" dist
          result=0
          npm run test:perf -- --grep 'scene slices stay within CPU and memory budgets' || result=$?
          jq -e --arg sha "$PREVIOUS" '.gitSha == $sha and .result.transitions == 40' artifacts/perf/summary.json
          mv artifacts/perf "$RUNNER_TEMP/observations/baseline"
          mv dist "$RUNNER_TEMP/prior/dist"
          echo "Baseline performance exit code $result" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the candidate
        run: |
          GITHUB_SHA="$PRODUCT" npm run build
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha' artifacts/build/dist-manifest.json
      - uses: actions/upload-artifact@v5
        with:
          name: production-dist-${{ inputs.product }}
          path: |
            dist
            artifacts/build/dist-manifest.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
      - id: measure
        name: Measure candidate for 20 uninstrumented round trips
        continue-on-error: true
        env:
          PERF_RUN: "1"
          PERF_SCENE_CYCLES: "20"
          PERF_SOURCE_SHA: ${{ inputs.product }}
        run: npm run test:perf -- --grep 'scene slices stay within CPU and memory budgets'
      - id: interactions
        name: Exercise actual keyboard, pointer and zoom behavior
        continue-on-error: true
        run: |
          npx playwright test --project=chromium --project=mobile-chromium --retries=0 --grep 'oak-tree fit fills|continuous zoom retains grounded|ordinary scenes hide the progress|five authored LOD bands|the apartment minimap reveals|the home atlas keeps its artwork|Apartment handoff settles|continued zoom at a terminal|the Apartment minimap focuses|plant cell exposes its organelle'
      - name: Encrypt measured evidence
        if: ${{ !cancelled() }}
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          mkdir -p "$RUNNER_TEMP/observations"
          if test -d artifacts/perf; then cp -r artifacts/perf "$RUNNER_TEMP/observations/candidate"; fi
          if test -f artifacts/e2e/results.json; then cp artifacts/e2e/results.json "$RUNNER_TEMP/observations/interactions.json"; fi
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          tar -C "$RUNNER_TEMP" -czf - observations | openssl cms -encrypt -binary -stream -aes-256-cbc -outform DER -out "$RUNNER_TEMP/comparison.cms" "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: warm-layout-comparison
          path: ${{ runner.temp }}/comparison.cms
          if-no-files-found: error
          retention-days: 7
      - name: Enforce candidate results
        run: |
          test "$PERFORMANCE" = success && test "$INTERACTIONS" = success
        env:
          PERFORMANCE: ${{ steps.measure.outcome }}
          INTERACTIONS: ${{ steps.interactions.outcome }}
