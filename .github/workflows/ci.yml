name: Verify visible-word encounters and warm navigation
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full encounter-timing candidate commit SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  BASE: fa26b2f34781a60eec48b78cf9f8a58999198650
  PRODUCT: ${{ inputs.candidate }}
  DWELL: apartment words need a fresh readable dwell after the scene word index closes
  RED_ASSERTION: hidden apartment words must stay unencountered while the empty scene index is open
  CROP: ordinary scenes hide the progress hint while the canvas counts only the current crop
  INDEX: the current-scene word index finds and focuses a real label without a scene jump
  WORDS: open-plan workstation labels its photographed mouse, drawer handle and shared printer before returning to the office
  ZOOM: open-plan workstation zoom keeps the printer and chair caster in the room and opens desktop equipment from the keyboard
  ATRIUM: returning to the office restores the atrium photograph and its own object labels
jobs:
  encounters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASE"
          npm ci > "$RUNNER_TEMP/install.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1
      - uses: actions/download-artifact@v5
        id: download_baseline
        continue-on-error: true
        with:
          name: production-dist-${{ env.BASE }}
          run-id: 45759679904
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Verify the baseline artifact before starting its server
        id: base_artifact
        if: ${{ steps.download_baseline.outcome == 'success' }}
        continue-on-error: true
        run: |
          manifest="$RUNNER_TEMP/previous/artifacts/build/dist-manifest.json"
          jq -e --arg sha "$BASE" '.gitSha == $sha and (.files | length > 0)' "$manifest"
          jq -r '.files[] | "\(.sha256)  \(.path)"' "$manifest" > "$RUNNER_TEMP/baseline.sha256"
          (cd "$RUNNER_TEMP/previous/dist" && sha256sum --quiet --check "$RUNNER_TEMP/baseline.sha256")
      - name: Observe hidden words counting as encountered on the baseline
        id: baseline
        if: ${{ steps.base_artifact.outcome == 'success' }}
        continue-on-error: true
        run: |
          mv "$RUNNER_TEMP/previous/dist" dist
          code=0
          ./node_modules/.bin/playwright test tests/e2e/world.spec.ts --grep "$DWELL$" --project=chromium --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/old.log" 2>&1 || code=$?
          mv dist "$RUNNER_TEMP/previous/dist"
          mv artifacts/e2e "$RUNNER_TEMP/old"
          test "$code" -eq 1
      - name: Check candidate types, scene data and encounter history
        run: |
          npm run typecheck > "$RUNNER_TEMP/types.log" 2>&1
          npm run validate:data -- --allow-image-reviewed > "$RUNNER_TEMP/data.log" 2>&1
          npm exec -- tsx --test tests/domain/discovery.test.ts tests/domain/labelLayout.test.ts > "$RUNNER_TEMP/domain.log" 2>&1
      - name: Build and record the candidate
        run: |
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build > "$RUNNER_TEMP/manifest.log" 2>&1
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha' artifacts/build/dist-manifest.json
          npm run test:ssr > "$RUNNER_TEMP/ssr.log" 2>&1
      - uses: actions/upload-artifact@v5
        id: product_artifact
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            dist
            artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Exercise encounter timing, the word index and the return to the office
        run: |
          code=0
          ./node_modules/.bin/playwright test tests/e2e/{world,label-zoom-retention,office-conference}.spec.ts --grep "($DWELL|$CROP|$INDEX|$WORDS|$ZOOM|$ATRIUM)$" \
            --project=chromium --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/new.log" 2>&1 || code=$?
          mv artifacts/e2e "$RUNNER_TEMP/new"
          exit "$code"
      - name: Check each browser result and retain only the relevant evidence
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          out = temp / "encounter-evidence"
          out.mkdir()
          titles = {os.environ[k]: k for k in ("DWELL", "CROP", "INDEX", "WORDS", "ZOOM", "ATRIUM")}
          projects = ("chromium", "mobile-chromium")
          screenshots = {"Open-plan-left-mouse-painted-card", "center keyboard-end", "office-atrium-return"}

          def cases(suite):
              for spec in suite.get("specs", []):
                  for test in spec["tests"]:
                      yield titles.get(spec["title"]), test
              for child in suite.get("suites", []):
                  yield from cases(child)

          def check_build(build):
              old = build == "old"
              selected = ["DWELL"] if old else titles.values()
              expected = {(case, project) for case in selected for project in projects}
              report = json.loads((temp / build / "results.json").read_text())
              stats = report["stats"]
              observations = []
              ok = not report["errors"]
              for case, test in cases(report):
                  project = test["projectName"]
                  if (case, project) not in expected:
                      ok = False
                      continue
                  expected.remove((case, project))
                  results = test["results"]
                  result = results[0] if results else {}
                  passed = (test["expectedStatus"] == "passed" and len(results) == 1 and result.get("retry") == 0
                            and result.get("status") == ("failed" if old else "passed"))
                  observation = {"case": case, "project": project, "status": result.get("status")}
                  hidden_credit_evidence = False
                  for a in result.get("attachments", []):
                      name = a["name"]
                      if case == "DWELL" and name == "index-hidden-encounters" and a["contentType"] == "application/json":
                          counts = json.loads(base64.b64decode(a["body"], validate=True))
                          prior, fresh, credited = (counts[k] for k in ("previouslySeen", "fresh", "hiddenCredits"))
                          if all(isinstance(ids, list) and all(isinstance(i, str) for i in ids) for ids in (prior, fresh, credited)):
                              observation["previouslySeen"] = len(prior)
                              observation["unseenBeforeOpening"] = len(fresh)
                              observation["creditedWhileHidden"] = len(credited)
                              hidden_credit_evidence = bool(fresh) and set(credited) <= set(fresh) and bool(credited) == old
                      if name in screenshots and a.get("contentType") == "image/png" and "body" in a:
                          png = base64.b64decode(a["body"], validate=True)
                          assert png.startswith(b"\x89PNG\r\n\x1a\n"), "invalid screenshot"
                          (out / f"{build}-{project}-{name.replace(' ', '-')}.png").write_bytes(png)
                  if old:
                      matched = os.environ["RED_ASSERTION"] in result.get("error", {}).get("message", "")
                      observation["matchedHiddenWordAssertion"] = matched
                      passed = passed and matched
                  if case == "DWELL":
                      passed = passed and hidden_credit_evidence
                  observation["accepted"] = passed
                  ok = ok and passed
                  observations.append(observation)
              count = len(selected) * len(projects)
              ok = (ok and not expected and stats["flaky"] == stats["skipped"] == 0
                    and stats["unexpected"] == (count if old else 0) and stats["expected"] == (0 if old else count))
              evidence = {"commit": os.environ["BASE" if old else "PRODUCT"], "accepted": ok,
                          "missing": sorted(expected), "results": observations}
              (out / f"{build}.json").write_text(json.dumps(evidence, indent=2) + "\n")
              assert ok, "browser evidence did not meet the expected outcome"

          failures = []
          for build in ("old", "new"):
              try:
                  check_build(build)
              except (AssertionError, KeyError, ValueError, FileNotFoundError) as error:
                  # Assertion labels are controlled by this verifier; raw reporter errors stay on the runner.
                  reason = str(error) if isinstance(error, AssertionError) else type(error).__name__
                  failures.append(f"{build}: {reason}")
          if failures:
              (out / "incomplete.txt").write_text("\n".join(failures) + "\n")
              raise SystemExit("\n".join(failures))
          PY
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: encounter-evidence-${{ env.PRODUCT }}
          path: ${{ runner.temp }}/encounter-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require the observed regression
        if: ${{ !cancelled() }}
        env:
          BASELINE: ${{ steps.baseline.outcome }}
        run: test "$BASELINE" = success
      - name: Prepare the same-runner performance comparison
        id: prepare_perf
        if: ${{ !cancelled() && steps.product_artifact.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/performance"
          mv dist "$RUNNER_TEMP/candidate-dist"
          cat > "$RUNNER_TEMP/measure.sh" <<'SH'
          set -euo pipefail
          build=$1
          sha=$2
          artifact=$3
          out="$RUNNER_TEMP/performance/$build.json"
          jq -n --arg sha "$sha" '{sha:$sha,complete:false}' > "$out"
          test ! -e dist
          mv "$artifact" dist
          trap 'mv dist "$artifact"' EXIT
          rc=0
          PERF_RUN=1 PERF_SCENE_CYCLES=20 PERF_SOURCE_SHA="$sha" GITHUB_STEP_SUMMARY="$RUNNER_TEMP/$build-perf.md" \
            npm run test:perf -- --grep 'scene slices stay within CPU and memory budgets' --retries=0 > "$RUNNER_TEMP/$build-perf.log" 2>&1 || rc=$?
          mv artifacts/perf "$RUNNER_TEMP/$build-perf"
          jq -e --arg sha "$sha" --argjson rc "$rc" '
            def metric($name; $value; $limit):
              {name:$name, value:$value, limit:$limit,
               passed:(($value|type) == "number" and ($limit|type) == "number" and $value <= $limit)};
            select(.gitSha == $sha and .scenario.cycles == 20 and .result.transitions == 40) |
            .budgets as $b |
            {sha:.gitSha,transitions:.result.transitions,testExit:$rc,complete:true,checks:[
              metric("coldLcpMs";.cold.lcpMs;$b.coldLcpMs),
              metric("visualTransitionP95Ms";.visualTransitionP95Ms;$b.warmTransitionP95Ms),
              metric("browserCpuMsPerTransition";.result.browserCpuMsPerTransition;$b.browserCpuMsPerTransition),
              metric("rendererTaskMsPerTransition";.result.rendererTaskMsPerTransition;$b.rendererTaskMsPerTransition),
              metric("peakJsHeapUsedMiB";.result.memory.peakJsHeapUsedMiB;$b.peakJsHeapMiB),
              metric("coldPeakPssMiB";.cold.memory.peakPssMiB;$b.peakPssMiB),
              metric("peakPssMiB";.result.memory.peakPssMiB;$b.peakPssMiB),
              metric("retainedPssDeltaMiB";.result.memory.pssDeltaMiB;$b.retainedPssDeltaMiB),
              metric("liveDomNodes";.liveDomNodes;$b.peakDomNodes),
              metric("longTasksOver50Ms";([.browserState.longTasks[]|select(. > 50)]|length);2)
            ]} | .failed = [.checks[] | select(.passed|not) | .name]' \
            "$RUNNER_TEMP/$build-perf/summary.json" > "$RUNNER_TEMP/$build-metrics.json"
          mv "$RUNNER_TEMP/$build-metrics.json" "$out"
          jq -r '.checks[] | "\(.name) = \(.value), limit \(.limit), passed \(.passed)"' "$out"
          # The old build is a comparison. Its measured budget failures are retained.
          if [[ "$build" == old ]]; then
            jq -e 'all(.checks[]; (.value|type) == "number" and (.limit|type) == "number") and
              .testExit == (if (.failed|length) == 0 then 0 else 1 end)' "$out"
          else
            jq -e '.testExit == 0 and (.failed|length) == 0' "$out"
          fi
          SH
      - name: Record all baseline budgets over forty transitions
        if: ${{ !cancelled() && steps.prepare_perf.outcome == 'success' && steps.base_artifact.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/measure.sh" old "$BASE" "$RUNNER_TEMP/previous/dist"
      - name: Enforce all candidate budgets over forty transitions
        if: ${{ !cancelled() && steps.prepare_perf.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/measure.sh" new "$PRODUCT" "$RUNNER_TEMP/candidate-dist"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.prepare_perf.outcome == 'success' }}
        with:
          name: navigation-performance-${{ env.PRODUCT }}
          path: ${{ runner.temp }}/performance
          if-no-files-found: error
          retention-days: 7
