name: Verify airport baggage service and suitcase packing
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full product commit SHA
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: e742ded35e6ba930797935a8c4d33c83c6b73bac
  PRODUCT: ${{ inputs.candidate }}
jobs:
  baggage:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASELINE }}
          run-id: "45942657425"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify sources and frozen production files
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASELINE"
          test "$(sha256sum "$RUNNER_TEMP/frozen/artifacts/build/dist-manifest.json" | cut -d' ' -f1)" = 8d0968ee625bc4d157316b1cdbdcb588a3f5fa40ba299388c9df3d7c47448cc1
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/frozen" "$BASELINE"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install pinned dependencies and Chromium
        run: |
          npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Reproduce zooming the counter on the frozen baggage claim photograph
        id: red
        continue-on-error: true
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/check-baggage-services.py baseline
      - name: Validate the candidate vocabulary and pending image reviews
        run: npm run validate:data -- --allow-image-reviewed
      - name: Typecheck and lint changed code
        run: |
          npm run typecheck
          git diff --name-only -z "$BASELINE" "$PRODUCT" -- '*.ts' '*.mjs' | xargs -0r ./node_modules/.bin/eslint --
      - name: Build the frozen candidate once and verify the manifest
        id: build
        run: |
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          python ../.github/verify-office-phone.py manifest . "$PRODUCT"
      - name: Enter the baggage service desk and packing table and return by zoom
        run: python ../.github/check-baggage-services.py candidate
      - name: Run all domain and vocabulary checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:unit
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: airport-baggage-services-${{ github.run_id }}
          path: ${{ runner.temp }}/baggage-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require the observed baseline zoom on the wooden counter
        run: test "$RED_OUTCOME" = success
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
