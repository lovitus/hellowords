name: Garden word movement diagnosis
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Public recipient for the private scene observations
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  WRANGLER_LOG_PATH: .wrangler/wrangler.log
  PERF_SOURCE_SHA: 6c8ae1d2db672310ec4cd35321ca423512a5266c
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.PERF_SOURCE_SHA }}
          run-id: 45666789444
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-build
      - run: |
          jq -e --arg sha "$PERF_SOURCE_SHA" '.gitSha == $sha' "$RUNNER_TEMP/published-build/artifacts/build/dist-manifest.json"
          mv "$RUNNER_TEMP/published-build/dist" dist
          npx playwright install --with-deps chromium
      - name: Record existing browser gesture on the candidate distribution
        id: browser
        continue-on-error: true
        run: npx playwright test tests/e2e/label-zoom-retention.spec.ts --grep 'continuous zoom retains grounded' --project=chromium --retries=0
      - name: Identify a reproducible conflict on the same layout implementation
        id: replay
        continue-on-error: true
        run: timeout --kill-after=5s 180s ./node_modules/.bin/tsx scripts/probe-garden-slot.mjs
      - name: Preserve exact geometry and camera path for replay
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' }}
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          test -s artifacts/handoff-observations/garden-0.json
          cp artifacts/e2e/results.json artifacts/handoff-observations/browser-result.json
          if test -s artifacts/correctness/garden-geometry-replay.json; then cp artifacts/correctness/garden-geometry-replay.json artifacts/handoff-observations/; fi
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          tar -C artifacts -czf - handoff-observations | openssl cms -encrypt -binary -stream -aes-256-cbc -outform DER -out "$RUNNER_TEMP/garden.cms" "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v5
        with:
          name: garden-observations
          path: ${{ runner.temp }}/garden.cms
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the real browser gate outcome
        env:
          BROWSER: ${{ steps.browser.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
        run: test "$BROWSER" = success && test "$REPLAY" = success
