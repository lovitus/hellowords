name: Verify pathology photo and workstation journeys
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full product commit SHA
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: e3f2547770119c6e01deaf9f84d049214c494424
  FIRST: 7df9e46a0eb51351014e8844f0551088bdbb9cde
  PRODUCT: ${{ inputs.candidate }}
jobs:
  hospital:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: pathology-photo-45939354580
          run-id: "45939354580"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify the previous photo verdict and the exact vocabulary change
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASELINE"
          git diff --exit-code "$FIRST" HEAD -- . ':!postponed-tasks.md' ':!public/data/scenes/pathology-lab.json'
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = "public/data/scenes/pathology-lab.json"
          previous = subprocess.check_output(["git", "show", f"{os.environ['FIRST']}:{p}"]).decode()
          assert previous.count("tray sidewall") == 2 and previous.count("tray-sidewall") == 4
          assert previous.replace("tray-sidewall", "staining-tray-wall").replace("tray sidewall", "staining tray wall").replace("托盘侧壁", "染色盘侧壁") == Path(p).read_text()
          receipts = Path(os.environ["RUNNER_TEMP"]) / "frozen"
          for phase, n in [("baseline",2), ("candidate",14)]:
              data = json.loads((receipts / f"{phase}.json").read_bytes())
              assert data["accepted"] and len(data["cases"]) == n
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install pinned dependencies and Chromium
        run: |
          npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Validate the candidate vocabulary and pending image reviews
        run: npm run validate:data -- --allow-image-reviewed
      - name: Typecheck, lint and check the vocabulary contracts
        run: |
          npm run typecheck
          git diff --name-only -z "$BASELINE" "$PRODUCT" -- '*.ts' '*.mjs' | xargs -0r ./node_modules/.bin/eslint --
          regen="$RUNNER_TEMP/hospital-regen"
          mkdir -p "$regen/scripts" "$regen/public/data"
          cp scripts/add-professional-vocabulary.mjs "$regen/scripts/"
          cp -R public/data/scenes "$regen/public/data/"
          node "$regen/scripts/add-professional-vocabulary.mjs"
          cmp public/data/scenes/hospital.json "$regen/public/data/scenes/hospital.json"
          cmp public/data/scenes/pathology-lab.json "$regen/public/data/scenes/pathology-lab.json"
      - name: Build the frozen candidate once and verify the manifest
        id: build
        run: |
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          python ../.github/verify-office-phone.py manifest . "$PRODUCT"
      - name: Read the microtome from the map and after both workstation journeys
        run: python ../.github/check-hospital-photo.py candidate
      - name: Recheck baggage-drop vocabulary and finish both vocabulary suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ./node_modules/.bin/tsx --test tests/domain/baggageDropStation.test.ts
          node --test tests/semantic/*.test.mjs tests/lexical-world/*.test.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: pathology-photo-${{ github.run_id }}
          path: ${{ runner.temp }}/hospital-evidence
          if-no-files-found: error
          retention-days: 7
