name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_LOG_PATH: .wrangler/wrangler.log

jobs:
  verification:
    name: Full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm run test:unit
      # Tests use this exact build on the same runner: storage quotas cannot
      # prevent a downstream test job from obtaining it.
      - run: npm run build
      - run: npm run test:ssr
      - run: node scripts/analyze-build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:perf
        env:
          PERF_RUN: "1"
          PERF_SCENE_CYCLES: "20"
      # Retention is optional; every validation command above remains blocking.
      # Missing downloadable output must never be used as release evidence.
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: verification-${{ github.sha }}
          path: |
            artifacts/correctness
            artifacts/build
            artifacts/e2e
            artifacts/perf
            dist
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
