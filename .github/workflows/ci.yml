name: Verify hospital photo and department journeys
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full product commit SHA
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: 31e079843aa8e0ade74e08b70222ab0239dbcc99
  PRODUCT: ${{ inputs.candidate }}
jobs:
  hospital:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASELINE }}
          run-id: "45932339082"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify sources and frozen production files
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASELINE"
          test "$(sha256sum "$RUNNER_TEMP/frozen/artifacts/build/dist-manifest.json" | cut -d' ' -f1)" = bdd690b6267be35b05cdd694f57c944f1215009c917a42ba81d497f6d3e49467
          python ../.github/verify-office-phone.py manifest "$RUNNER_TEMP/frozen" "$BASELINE"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install pinned dependencies and Chromium
        run: |
          npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Reproduce the misplaced microscope dot in both viewports
        id: red
        continue-on-error: true
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/check-hospital-photo.py baseline
      - name: Validate the candidate vocabulary and pending image reviews
        run: npm run validate:data -- --allow-image-reviewed
      - name: Typecheck, lint and check the vocabulary contracts
        run: |
          npm run typecheck
          git diff --name-only -z "$BASELINE" "$PRODUCT" -- '*.ts' '*.mjs' | xargs -0r ./node_modules/.bin/eslint --
          regen="$RUNNER_TEMP/hospital-regen"
          mkdir -p "$regen/scripts" "$regen/public/data"
          cp scripts/add-professional-vocabulary.mjs "$regen/scripts/"
          cp -R public/data/scenes "$regen/public/data/"
          node "$regen/scripts/add-professional-vocabulary.mjs"
          cmp public/data/scenes/hospital.json "$regen/public/data/scenes/hospital.json"
      - name: Build the frozen candidate once and verify the manifest
        id: build
        run: |
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          python ../.github/verify-office-phone.py manifest . "$PRODUCT"
      - name: Read the microscope and return from the hospital, airport and office departments
        run: python ../.github/check-hospital-photo.py candidate
      - name: Run all domain and vocabulary checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:unit
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: hospital-photo-${{ github.run_id }}
          path: ${{ runner.temp }}/hospital-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require the observed microscope dot on the old laboratory sign
        run: test "$RED_OUTCOME" = success
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
