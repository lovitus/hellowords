name: Verify apartment zoom and return to the office on frozen builds
on: workflow_dispatch
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: 72540c6f36fa8024dd93a8eb0e40b207337a9afb
  CANDIDATE: 76356646e3d7ac57407dd2a0dfa243d4bf33ae9a
  OUTWARD: zooming back out in the apartment keeps readable words in their clear slots
  OFFICE: returning to the office restores the atrium photograph and its own object labels
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: |
          npm ci > "$RUNNER_TEMP/install.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASELINE }}
          run-id: 45765967579
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.CANDIDATE }}
          run-id: 45769355786
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Verify both dist trees and run the same desktop wheel sequence
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          for label in ('baseline', 'candidate'):
              root = Path(os.environ['RUNNER_TEMP']) / label
              dist = root / 'dist'
              manifest = json.loads((root / 'artifacts/build/dist-manifest.json').read_bytes())
              assert manifest['gitSha'] == os.environ[label.upper()]
              files = manifest['files']
              assert len(files) == len({r['path'] for r in files}) == 392
              assert {p.relative_to(dist).as_posix() for p in dist.rglob('*') if p.is_file()} == {r['path'] for r in files}
              for r in files:
                  contents = (dist / r['path']).read_bytes()
                  assert len(contents) == r['bytes'] and hashlib.sha256(contents).hexdigest() == r['sha256'], r['path']
          PY
          test ! -e dist
          for label in baseline candidate; do
            printf '[chromium] > e2e/label-zoom-retention.spec.ts > %s\n' "$OUTWARD" > "$RUNNER_TEMP/cases.txt"
            if [[ "$label" == candidate ]]; then
              for project in chromium mobile-chromium; do
                printf '[%s] > e2e/office-conference.spec.ts > %s\n' "$project" "$OFFICE" >> "$RUNNER_TEMP/cases.txt"
              done
            fi
            mv "$RUNNER_TEMP/$label/dist" dist
            status=0
            ./node_modules/.bin/playwright test --test-list "$RUNNER_TEMP/cases.txt" --retries=0 \
              > "$RUNNER_TEMP/$label/test.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "$RUNNER_TEMP/$label/exit"
            mv dist "$RUNNER_TEMP/$label/dist"
            if [[ -d artifacts/e2e ]]; then mv artifacts/e2e "$RUNNER_TEMP/$label/report"; fi
          done
      - name: Extract geometry and office screenshots before judging results
        if: ${{ !cancelled() }}
        run: python .github/verify-apartment-frames.py
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: apartment-office-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require old jump, new stability and both office returns
        run: jq -e '.baseline.accepted and .candidate.accepted' "$RUNNER_TEMP/evidence/summary.json"
