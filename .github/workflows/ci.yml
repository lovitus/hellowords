name: Attribute memory after twenty apartment round trips
on: workflow_dispatch

permissions:
  contents: read
  actions: read

env:
  PRODUCT: 4dae0eaa88776720ef45cc42fc502fd9c5f86d41
  BUILD_RUN: "45753668035"
  CI: "true"

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT }}
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build
      - name: Verify the artifact inventory, file sizes and SHA-256 digests
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          artifact = Path(os.environ["RUNNER_TEMP"]) / "build"
          dist = artifact / "dist"
          manifest = json.loads((artifact / "artifacts/build/dist-manifest.json").read_text())
          files = manifest["files"]
          assert manifest["gitSha"] == os.environ["PRODUCT"]
          assert len(files) == manifest["totals"]["files"] > 0
          paths = list(dist.rglob("*"))
          assert not dist.is_symlink() and not any(p.is_symlink() for p in paths)
          inventory = {p.relative_to(dist).as_posix() for p in paths if p.is_file()}
          assert len(inventory) == len(files) and inventory == {f["path"] for f in files}
          for entry in files:
              path = dist / entry["path"]
              assert path.stat().st_size == entry["bytes"]
              with path.open("rb") as stream:
                  assert hashlib.file_digest(stream, "sha256").hexdigest() == entry["sha256"]
          print(f"Verified {len(files)} production files")
          PY
          test ! -e dist
          mv "$RUNNER_TEMP/build/dist" dist
          cp ../probe/tests/perf/renderer-ownership.spec.ts tests/perf/
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install the product's locked dependencies and Chromium
        working-directory: product
        run: |
          npm ci
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Capture two detailed dumps and their renderer PSS
        working-directory: product
        env:
          PERF_RUN: "1"
        run: |
          umask 077
          if ! ./node_modules/.bin/playwright test tests/perf/renderer-ownership.spec.ts --project=performance --workers=1 --retries=0 --reporter=line > "$RUNNER_TEMP/probe.log" 2>&1; then
            if test -f "$RUNNER_TEMP/ownership-stage.txt"; then
              cat "$RUNNER_TEMP/ownership-stage.txt"
            else
              echo "The diagnostic failed before page setup"
            fi
            exit 1
          fi
          test -s "$RUNNER_TEMP/renderer-ownership.json"
      - uses: actions/upload-artifact@v5
        with:
          name: renderer-ownership-${{ env.PRODUCT }}
          path: ${{ runner.temp }}/renderer-ownership.json
          if-no-files-found: error
          retention-days: 7
