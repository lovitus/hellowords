name: Verify word card clearance on the office photograph
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Mobile word card candidate commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  BASE: 81e0a36420813cc716b097835597ebb7dc66740d
  PRODUCT: ${{ inputs.candidate }}
  JOURNEY: phone can switch between the photographed rack and its light with a word card open
jobs:
  gestures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASE"
          npm ci
          ./node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASE }}
          run-id: 45752214005
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Confirm the old phone word card covers part of the selected ring
        id: baseline
        continue-on-error: true
        run: |
          manifest="$RUNNER_TEMP/previous/artifacts/build/dist-manifest.json"
          jq -e --arg sha "$BASE" '.gitSha == $sha' "$manifest"
          jq -r '.files[] | "\(.sha256)  \(.path)"' "$manifest" > "$RUNNER_TEMP/baseline.sha256"
          mv "$RUNNER_TEMP/previous/dist" dist
          (cd dist && sha256sum --quiet --check "$RUNNER_TEMP/baseline.sha256")
          code=0
          ./node_modules/.bin/playwright test tests/e2e/office-conference.spec.ts --grep "$JOURNEY" --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/old.log" 2>&1 || code=$?
          mv dist "$RUNNER_TEMP/previous/dist"
          mv artifacts/e2e/results.json "$RUNNER_TEMP/old.json"
          test "$code" -eq 1
          jq -e '
            .stats.unexpected == 1 and (.errors | length == 0) and
            ([.. | objects | select(has("projectName") and has("results")) |
              select(.results | length == 1) | . as $test | .results[0] |
              select(.status == "failed") | .attachments[] |
              select(.name == "server-rack-position") | (.body | @base64d | fromjson) |
              select(.dotClearance != null and .dotClearance < 5) | $test.projectName]
              ) == ["mobile-chromium"]' "$RUNNER_TEMP/old.json"
      - name: Check the changed components
        run: |
          npm run typecheck
          ./node_modules/.bin/eslint app/components/WorldApp.tsx tests/e2e/office-conference.spec.ts
      - name: Build and record the candidate
        run: |
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha' artifacts/build/dist-manifest.json
          npm run test:ssr
      - uses: actions/upload-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            dist
            artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Read both objects on the phone and exercise the related word and explicit bridge controls
        run: |
          ./node_modules/.bin/playwright test tests/e2e/office-conference.spec.ts tests/e2e/kitchen-vocabulary.spec.ts tests/e2e/spatial-semantic-bridge.spec.ts \
            --grep "$JOURNEY|a related kitchen word opens|a reviewed spatial word enters" --project=chromium --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/new.log" 2>&1
          jq -e '.stats.expected == 4 and .stats.flaky == 0 and .stats.unexpected == 0 and .stats.skipped == 2 and (.errors | length == 0)' artifacts/e2e/results.json
      - name: Keep the photographs and visible ring measurements
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/office-evidence"
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          out = temp / "office-evidence"
          for build, report in [("old", temp / "old.json"), ("new", Path("artifacts/e2e/results.json"))]:
              if not report.is_file():
                  continue
              def collect(suite):
                  for spec in suite.get("specs", []):
                      for test in spec["tests"]:
                          for result in test["results"]:
                              for a in result["attachments"]:
                                  if a["name"].endswith(("-card", "-position")) and "body" in a:
                                      extension = "png" if a["contentType"] == "image/png" else "json"
                                      file = f"{build}-{test['projectName']}-{a['name']}.{extension}"
                                      (out / file).write_bytes(base64.b64decode(a["body"], validate=True))
                              if result.get("error"):
                                  print(build, test["projectName"], result["error"].get("message","")[:750])
                  for child in suite.get("suites", []):
                      collect(child)
              collect(json.loads(report.read_text()))
          PY
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: office-card-evidence
          path: ${{ runner.temp }}/office-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require the observed regression
        if: ${{ !cancelled() }}
        env:
          BASELINE: ${{ steps.baseline.outcome }}
        run: test "$BASELINE" = success
