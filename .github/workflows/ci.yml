name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compare_published_baseline:
        description: Compare the last audited product source on the same runner
        type: boolean
        default: false
      milestone_release_preflight:
        description: Run the 10k public-release preflight and verify the clean commit; does not publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_LOG_PATH: .wrangler/wrangler.log

jobs:
  regression_baseline:
    name: Reproduce display regressions before the fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restore the old display behavior in this disposable checkout
        run: |
          git checkout --detach HEAD^
          git restore --source=HEAD^ -- app/components/LexicalWorld.tsx app/components/lexical-world.css app/components/SemanticZoomField.tsx app/components/semantic-zoom-field.css app/domain/semanticZoom.ts app/domain/semanticBackdrop.ts
          sed -i 's/manual \&\& next === "in"/false/' app/components/SceneViewport.tsx
          sed -i 's/const VOCABULARY_HINTS_ENABLED = false/const VOCABULARY_HINTS_ENABLED = true/' app/components/SceneViewport.tsx
          sed -i 's/npm run start -- --hostname/npm run dev -- --hostname/' playwright.config.ts
      - name: Verify the previous motif and crossing leaders fail numerical assertions
        run: |
          if npx tsx --test --test-name-pattern='unit and quantity' tests/domain/semanticBackdrop.test.ts > "$RUNNER_TEMP/motif.tap" 2>&1; then exit 1; fi
          grep -q 'ERR_ASSERTION' "$RUNNER_TEMP/motif.tap"
          # The previous placement API accepts the same camera, viewport and label inputs.
          sed -i 's/  computeScenePlacements,/  computeSceneLabelLayout as computeScenePlacements,/' tests/domain/labelPlacement.test.ts
          if npx tsx --test --test-name-pattern='leaders never cross' tests/domain/labelPlacement.test.ts > "$RUNNER_TEMP/leaders.tap" 2>&1; then exit 1; fi
          grep -q 'ERR_ASSERTION' "$RUNNER_TEMP/leaders.tap"
      - name: Verify the old interface fails the user-facing assertions
        run: |
          if npx playwright test tests/e2e/label-zoom-retention.spec.ts tests/e2e/semantic-density.spec.ts --project=chromium --project=mobile-chromium --workers=1 --retries=0 --grep='continuous zoom retains|long words and definitions fit|ordinary scenes hide' --reporter=json > "$RUNNER_TEMP/display.json"; then exit 1; fi
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/display.json`, "utf8"));
          const specs = suite => [...(suite.specs ?? []), ...(suite.suites ?? []).flatMap(specs)];
          const tested = report.suites.flatMap(specs);
          const checks = [
            ["continuous zoom retains", "chromium", /words that moved despite a clear slot|largest jump between painted frames/],
            ["long words and definitions fit", "mobile-chromium", /General Communication must contain|vt\.|vi\.|full search definition must fit/],
            ["ordinary scenes hide", "chromium", /toBeHidden/],
          ];
          for (const [title, project, expected] of checks) {
            const test = tested.find(spec => spec.title.startsWith(title))?.tests.find(t => t.projectName === project);
            assert.equal(test?.results[0]?.status, "failed", `${project}: ${title}`);
            assert.ok(test.results[0].errors.some(err => expected.test(err.message)), `Expected the behavioral failure: ${title}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- Reproduced: ${title} (${project})\n`);
          }
          NODE
  verification:
    name: Full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Select the exact clean product candidate
        id: candidate
        run: |
          git checkout --detach HEAD^
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check 10k milestone release preflight
        if: ${{ inputs.milestone_release_preflight }}
        run: npm run release:check -- --milestone
      - run: npm run lint
        if: ${{ !inputs.milestone_release_preflight }}
      - run: npm run typecheck
        if: ${{ !inputs.milestone_release_preflight }}
      - run: npm run validate:data
        if: ${{ !inputs.milestone_release_preflight }}
      - run: npm run test:unit
        if: ${{ !inputs.milestone_release_preflight }}
      # Tests use this exact build on the same runner: storage quotas cannot
      # prevent a downstream test job from obtaining it.
      - run: npm run build
        if: ${{ !inputs.milestone_release_preflight }}
      - run: npm run test:ssr
        if: ${{ !inputs.milestone_release_preflight }}
      - run: node scripts/analyze-build.mjs
        if: ${{ !inputs.milestone_release_preflight }}
      - run: npx playwright install --with-deps chromium
      - name: Check out audited baseline for optional comparison
        if: ${{ inputs.compare_published_baseline && !inputs.milestone_release_preflight }}
        uses: actions/checkout@v6
        with:
          ref: 530f76ca4a1ce53e8ae7bf790bca3a618f40abd4
          path: baseline-reference
          persist-credentials: false
      - name: Prepare identical measurement harness for baseline
        if: ${{ inputs.compare_published_baseline && !inputs.milestone_release_preflight }}
        run: cp tests/perf/world-performance.spec.ts baseline-reference/tests/perf/world-performance.spec.ts
      - name: Build audited baseline
        if: ${{ inputs.compare_published_baseline && !inputs.milestone_release_preflight }}
        working-directory: baseline-reference
        run: npm ci && npm run build
      - name: Measure audited baseline (diagnostic, not candidate acceptance)
        if: ${{ inputs.compare_published_baseline && !inputs.milestone_release_preflight }}
        continue-on-error: true
        working-directory: baseline-reference
        env:
          PERF_RUN: "1"
          PERF_SCENE_CYCLES: "20"
          PERF_SOURCE_SHA: 530f76ca4a1ce53e8ae7bf790bca3a618f40abd4
        run: npm run test:perf
      - run: npm run test:perf
        id: candidate_performance
        continue-on-error: true
        if: ${{ !inputs.milestone_release_preflight }}
        env:
          PERF_RUN: "1"
          PERF_SCENE_CYCLES: "20"
      - name: Verify complete milestone candidate on the preflighted clean commit
        if: ${{ inputs.milestone_release_preflight }}
        run: GITHUB_SHA="$(git rev-parse HEAD)" PERF_SOURCE_SHA="$(git rev-parse HEAD)" npm run verify:full
      - run: npm run test:e2e
        id: candidate_browser
        continue-on-error: true
        if: ${{ !inputs.milestone_release_preflight }}
      - name: Enforce both candidate gates
        if: ${{ !cancelled() && !inputs.milestone_release_preflight }}
        env:
          PERF_OUTCOME: ${{ steps.candidate_performance.outcome }}
          BROWSER_OUTCOME: ${{ steps.candidate_browser.outcome }}
        run: |
          printf 'Performance: %s\nBrowser: %s\n' "$PERF_OUTCOME" "$BROWSER_OUTCOME"
          test "$PERF_OUTCOME" = success && test "$BROWSER_OUTCOME" = success
      # Retention is optional; every validation command above remains blocking.
      # Missing downloadable output must never be used as release evidence.
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: verification-${{ steps.candidate.outputs.sha }}
          path: |
            artifacts/correctness
            artifacts/build
            artifacts/e2e
            artifacts/perf
            dist
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
