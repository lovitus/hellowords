name: Attribute repeat image allocations to a scene
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Public certificate for diagnostic evidence
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  PRODUCT: 5af3aa6796b52ce8e288644449364bf3b430f46c
jobs:
  resident:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: |
          test "$(git rev-parse HEAD~2)" = "$PRODUCT"
          npm ci
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          run-id: 45671966683
          github-token: ${{ github.token }}
          path: .
      - run: |
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha' artifacts/build/dist-manifest.json
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Compare original artwork with an identifiable size for the unvisited kitchen
        env:
          RECORDS: ${{ runner.temp }}/residency
          PERF_RUN: "1"
        run: |
          mkdir -p "$RECORDS"
          printf 'Product %s\n' "$PRODUCT" > "$RECORDS/product.txt"
          for arm in original kitchen-size; do
            export MEMORY_EVIDENCE_DIR="$RECORDS/$arm"
            mkdir -p "$MEMORY_EVIDENCE_DIR"
            if test "$arm" = kitchen-size; then
              node --input-type=module - <<'JS'
          import sharp from "sharp";
          import { writeFile } from "node:fs/promises";
          const path = "dist/client/scenes/kitchen-premium-v3.jpg";
          const old = await sharp(path).metadata();
          if (old.width !== 1600 || old.height !== 900) throw Error("Unexpected original kitchen size");
          const marked = await sharp(path).resize(1024, 576).jpeg().toBuffer();
          await writeFile(path, marked);
          JS
            fi
            ./node_modules/.bin/playwright test tests/perf/world-performance.spec.ts --project=performance \
              --grep 'identify resident memory' --workers=1 --retries=0 > "$MEMORY_EVIDENCE_DIR/browser.log" 2>&1
            jq -e 'length == 7 and all(.[]; .dump.success)' "$MEMORY_EVIDENCE_DIR/checkpoints.json"
          done
      - name: Encrypt the diagnostic evidence
        if: ${{ !cancelled() }}
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -o pipefail
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          tar -C "$RUNNER_TEMP" -czf - residency | openssl cms -encrypt -stream -binary -aes-256-cbc \
            -outform DER -out "$RUNNER_TEMP/residency.cms" "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: scene-residency
          path: ${{ runner.temp }}/residency.cms
          if-no-files-found: error
          retention-days: 7
