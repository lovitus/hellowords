name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_LOG_PATH: .wrangler/wrangler.log

jobs:
  correctness:
    name: Correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm run test:unit
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: correctness-${{ github.sha }}
          path: artifacts/correctness
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Production build
    needs: correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ssr
      - run: node scripts/analyze-build.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: production-build-${{ github.sha }}
          path: |
            dist
            artifacts/build
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: Browser E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: production-build-${{ github.sha }}
          path: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-e2e-${{ github.sha }}
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 30

  perf:
    name: Runtime performance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PERF_RUN: "1"
      PERF_SCENE_CYCLES: "20"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: production-build-${{ github.sha }}
          path: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:perf
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: runtime-performance-${{ github.sha }}
          path: artifacts/perf
          if-no-files-found: error
          retention-days: 30
