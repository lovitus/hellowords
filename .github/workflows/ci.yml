name: Verify the hospital reception and dialysis round trip
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the hospital reception and dialysis candidate
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CI: "true"
  BASELINE: 7eafc63001dfcd4da5f3e43337ddd1c97bd7d01e
  PRODUCT: ${{ inputs.candidate }}
  MANIFEST_SHA256: 10a4fe689fcc7a64ccee49d26706fec8880c216f5b069003b8a52ac1fd1ce80f
  ARTIFACT_RUN: "46039903146"
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT }}
          fetch-depth: 2
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASELINE }}
          run-id: ${{ env.ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify the candidate checkout, manifest and every frozen file
        id: integrity
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git show -s --format=%P HEAD)" = "$BASELINE"
          python ../.github/frozen-display.py baseline-integrity
      - name: Retrieve the original completed 40-transition measurement
        uses: actions/download-artifact@v5
        id: original_evidence
        continue-on-error: true
        with:
          name: frozen-display-${{ env.ARTIFACT_RUN }}
          run-id: ${{ env.ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-evidence
      - name: Verify the original CPU and memory budget measurements against the frozen build
        id: baseline
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.original_evidence.outcome == 'success' }}
        continue-on-error: true
        run: python ../.github/frozen-display.py baseline-performance
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install the locked dependencies
        id: dependencies
        run: npm ci > "$RUNNER_TEMP/npm.log" 2>&1
      - name: Verify the original stale spatial vocabulary index and the candidate index
        id: spatial
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: python ../.github/frozen-display.py spatial
      - name: Lint the product
        id: lint
        continue-on-error: true
        run: python ../.github/frozen-display.py lint
      - name: Typecheck the product
        id: types
        continue-on-error: true
        run: python ../.github/frozen-display.py types
      - name: Install the locked Chromium
        id: browser
        continue-on-error: true
        run: ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1
      - name: Reach the hospital and attempt the missing reception entrance in the frozen application
        id: misplaced
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.browser.outcome == 'success' }}
        continue-on-error: true
        run: |
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
          trap 'mv dist "$RUNNER_TEMP/frozen/dist"' EXIT
          python ../.github/frozen-browser.py baseline
      - name: Build the verified candidate once
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          test ! -e dist
          GITHUB_SHA="$PRODUCT" npm run build > "$RUNNER_TEMP/build.log" 2>&1
          GITHUB_SHA="$PRODUCT" npm run analyze:build > "$RUNNER_TEMP/build-analysis.log" 2>&1
          python ../.github/frozen-display.py candidate-integrity
      - name: Retain this exact candidate build
        id: product_artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            product/dist
            product/artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Enter reception and dialysis and return on desktop and phone and retain the existing journeys
        id: journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        continue-on-error: true
        run: python ../.github/frozen-browser.py candidate
      - name: Measure the original 20 navigation cycles against the original budgets
        id: navigation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        continue-on-error: true
        run: python ../.github/frozen-display.py navigation
      - name: Run the affected domain and scene contracts
        id: domain
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: python ../.github/frozen-display.py domain
      - name: Run strict source and human-review validation
        id: strict
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: python ../.github/frozen-display.py strict
      - name: Record structural integrity and all outstanding image reviews independently
        id: structure
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: python ../.github/frozen-display.py structure
      - name: Record each independent outcome
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python ../.github/frozen-display.py record
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: frozen-display-${{ github.run_id }}
          path: ${{ runner.temp }}/frozen-display-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Require the original gates to pass
        if: ${{ !cancelled() }}
        run: jq -e '.passed' "$RUNNER_TEMP/frozen-display-evidence/result.json"
