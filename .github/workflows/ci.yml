name: Verify the airport baggage-drop journey
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Product commit with the baggage-drop scene and navigation
        required: true
        type: string
      recipient:
        description: Public certificate for the browser evidence
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: "true"
  BASE: 748d045d9b7576d6ef539d1032979e36cb7f7b03
  PRODUCT: ${{ inputs.candidate }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Prepare the source and browser
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^)" = "$BASE"
          npm ci
          ./node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.BASE }}
          run-id: 45696335349
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Reproduce the misplaced baggage scale on the previous build
        id: baseline
        continue-on-error: true
        run: |
          jq -e --arg sha "$BASE" '.gitSha == $sha' "$RUNNER_TEMP/previous/artifacts/build/dist-manifest.json"
          mv "$RUNNER_TEMP/previous/dist" dist
          code=0
          ./node_modules/.bin/playwright test tests/e2e/airport-bag-drop.spec.ts --grep 'airport bag drop keeps' --project=chromium --retries=0 > "$RUNNER_TEMP/evidence/old.log" 2>&1 || code=$?
          mv dist "$RUNNER_TEMP/previous/dist"
          mv artifacts/e2e/results.json "$RUNNER_TEMP/evidence/old.json"
          mv artifacts/e2e/test-results "$RUNNER_TEMP/evidence/old-screens"
          test "$code" -eq 1
          jq -e '
            .stats.unexpected == 1 and .stats.expected == 0 and .stats.skipped == 0 and .stats.flaky == 0 and
            any(.suites[].specs[] | select(.file == "e2e/airport-bag-drop.spec.ts") | .tests[];
              .projectName == "chromium" and (.results | length) == 1 and .results[0].status == "failed" and
              (.results[0].errors[0].message | contains("left baggage scale leader must end on the photographed floor scale")) and
              any(.results[0].attachments[]; .name == "left-baggage-scale-view" and .contentType == "image/png" and (.body | length) > 0) and
              any(.results[0].attachments[] | select(.name == "left-baggage-scale-geometry") | .body | @base64d | fromjson;
                .onObject == false and (.photoX - 300 | fabs) < 2 and (.photoY - 580 | fabs) < 2))' "$RUNNER_TEMP/evidence/old.json"
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-123febaec72a7da0b1038d3501a21742fa9df14c
          run-id: 45699531823
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/before-gesture
      - name: Reproduce the missing entrance and interrupted pinch on mobile
        id: gesture_baseline
        continue-on-error: true
        run: |
          jq -e '.gitSha == "123febaec72a7da0b1038d3501a21742fa9df14c"' "$RUNNER_TEMP/before-gesture/artifacts/build/dist-manifest.json"
          mv "$RUNNER_TEMP/before-gesture/dist" dist
          code=0
          ./node_modules/.bin/playwright test tests/e2e/airport-bag-drop.spec.ts --grep 'airport Fit keeps|one fixed-midpoint pinch' --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/evidence/old-gesture.log" 2>&1 || code=$?
          mv dist "$RUNNER_TEMP/before-gesture/dist"
          mv artifacts/e2e/results.json "$RUNNER_TEMP/evidence/old-gesture.json"
          mv artifacts/e2e/test-results "$RUNNER_TEMP/evidence/old-gesture-screens"
          test "$code" -eq 1
          jq -e '.stats.unexpected == 2 and
            any(.. | objects | .errors? // [] | .[]; .message | contains("airport Fit keeps the whole left check-in button")) and
            any(.. | objects | .errors? // [] | .[]; .message | contains("silver rollers enters the baggage conveyor"))' "$RUNNER_TEMP/evidence/old-gesture.json"
      - name: Verify scene data, camera geometry, navigation and label placement
        run: |
          git show "$BASE:public/data/scenes/baggage-drop-station.json" | jq -S '[.labels[] | {id, word, translation}] | sort_by(.id)' > "$RUNNER_TEMP/previous-words.json"
          jq -S '[(.labels[], .relatedWords[]) | {id, word, translation}] | sort_by(.id)' public/data/scenes/baggage-drop-station.json | cmp - "$RUNNER_TEMP/previous-words.json"
          npm run typecheck > "$RUNNER_TEMP/evidence/types.log" 2>&1
          npm run validate:data > "$RUNNER_TEMP/evidence/scene-data.log" 2>&1
          ./node_modules/.bin/tsx --test tests/domain/worldContent.test.ts tests/domain/baggageDropStation.test.ts tests/domain/checkInCounter.test.ts tests/domain/newFacilityScenes.test.ts tests/domain/sceneGraph.test.ts tests/domain/worldAtlasVisualContract.test.ts tests/domain/sceneVisualQuality.test.ts > "$RUNNER_TEMP/evidence/contracts.log" 2>&1
          ./node_modules/.bin/tsx --test --test-name-pattern='fill spare first-screen space|preserve default LOD disclosure' tests/domain/sceneLabelDensity.test.ts > "$RUNNER_TEMP/evidence/density.log" 2>&1
          ./node_modules/.bin/tsx --test tests/domain/camera.test.ts tests/domain/navigation.test.ts tests/domain/labelLayout.test.ts tests/domain/labelPlacement.test.ts > "$RUNNER_TEMP/evidence/room-domain.log" 2>&1
          ./node_modules/.bin/tsx --test --test-name-pattern='painted portal geometry round-trips|painted child art bounds round-trip|parent portal and child camera handoffs are exact inverses|reduced motion starts from one stable fitted frame|continuity settlement contains the complete child scene' tests/domain/screenSpaceLabels.test.ts > "$RUNNER_TEMP/evidence/framing.log" 2>&1
      - name: Build the candidate once
        run: |
          GITHUB_SHA="$PRODUCT" npm run build
          GITHUB_SHA="$PRODUCT" npm run analyze:build
          jq -e --arg sha "$PRODUCT" '.gitSha == $sha' artifacts/build/dist-manifest.json
          npm run test:ssr > "$RUNNER_TEMP/evidence/ssr.log" 2>&1
      - uses: actions/upload-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          path: |
            dist
            artifacts/build/dist-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Follow the route on desktop and mobile Chromium
        run: |
          ./node_modules/.bin/playwright test \
            tests/e2e/airport-bag-drop.spec.ts tests/e2e/world.spec.ts tests/e2e/portrait-room.spec.ts \
            --grep 'airport bag drop|airport Fit keeps|one fixed-midpoint pinch|portrait apartment entrances|enters a scene slice on zoom|root atlas wheel zoom stays' \
            --project=chromium --project=mobile-chromium --retries=0 > "$RUNNER_TEMP/evidence/new.log" 2>&1
          jq -e '
            .stats.unexpected == 0 and .stats.flaky == 0 and
            ([.suites[].specs[] | select(.file == "e2e/airport-bag-drop.spec.ts") | .tests[] |
              select(.results[0].status == "passed" and
                ((["baggage-drop-fit-both-platforms", "left-baggage-scale-painted-card", "left-scale-platform-painted-card",
                  "drop-conveyor-suitcase-painted-card", "second-conveyor-suitcase-painted-card", "right-baggage-scale-painted-card",
                  "right-suitcase-magnified", "silver-rollers-conveyor-entry", "baggage-drop-return", "check-in-counter-return"] -
                  [.results[0].attachments[] | select(.contentType == "image/png" and (.body | length) > 0) | .name]) | length) == 0 and
                ([.results[0].attachments[] | select(.name | endswith("-geometry")) | .body | @base64d | fromjson | select(.onObject == true)] | length) == 5)
              | .projectName] | sort) == ["chromium","mobile-chromium"]' artifacts/e2e/results.json
      - name: Preserve browser evidence
        if: ${{ !cancelled() }}
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -o pipefail
          if test -f artifacts/e2e/results.json; then cp artifacts/e2e/results.json "$RUNNER_TEMP/evidence/new.json"; fi
          if test -d artifacts/e2e/test-results; then cp -R artifacts/e2e/test-results "$RUNNER_TEMP/evidence/new-screens"; fi
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          tar -C "$RUNNER_TEMP" -czf - evidence | openssl cms -encrypt -stream -binary -aes-256-cbc -outform DER \
            -out "$RUNNER_TEMP/home-route.cms" "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: home-route-evidence
          path: ${{ runner.temp }}/home-route.cms
          if-no-files-found: error
          retention-days: 7
      - name: Require the original baggage scale failure
        if: ${{ !cancelled() }}
        run: test "${{ steps.baseline.outcome }}" = success && test "${{ steps.gesture_baseline.outcome }}" = success
