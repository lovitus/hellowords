name: Compare continued apartment navigation with idle time
on: workflow_dispatch

permissions:
  contents: read
  actions: read

env:
  CI: "true"
  PRODUCT: c0e2a62b54f7851f2c46efd6fe861c758f53b00a
  BUILD_RUN: "45850668568"

jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          path: probe
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT }}
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: production-dist-${{ env.PRODUCT }}
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Verify the archived production files
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          frozen = Path(os.environ["RUNNER_TEMP"]) / "frozen"
          raw = (frozen/"artifacts/build/dist-manifest.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == "71324f76b6ff4e9b6780535ca787d8d70c4b2bdac2fa910ad46b4878d60fc08d"
          manifest = json.loads(raw)
          assert manifest["gitSha"] == os.environ["PRODUCT"]
          dist = frozen / "dist"
          paths = list(dist.rglob("*"))
          assert dist.is_dir() and not dist.is_symlink() and not any(p.is_symlink() for p in paths)
          actual = {p.relative_to(dist).as_posix() for p in paths if p.is_file()}
          files = manifest["files"]
          assert len(actual) == len(files) == 392 and actual == {f["path"] for f in files}
          for entry in files:
              path = dist / entry["path"]
              assert path.stat().st_size == entry["bytes"]
              with path.open("rb") as stream:
                  assert hashlib.file_digest(stream, "sha256").hexdigest() == entry["sha256"]
          PY
          test ! -e dist
          mv "$RUNNER_TEMP/frozen/dist" dist
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install the locked browser and dependencies
        working-directory: product
        run: |
          npm ci > "$RUNNER_TEMP/dependencies.log" 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1
      - name: Compare continued navigation and equally long idle periods
        run: |
          umask 077
          node probe/.github/continued-use.mjs product "$RUNNER_TEMP/continued-use"
          jq -e '.status == "complete"' "$RUNNER_TEMP/continued-use/run.json" >/dev/null
          jq -e '[.pairs[].pair] == ["main-1", "main-2", "allocators-1"]' "$RUNNER_TEMP/continued-use/summary.json" >/dev/null
      - name: Preserve the numeric checkpoint records
        if: ${{ !cancelled() && hashFiles('probe/.github/continued-use.mjs') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: continued-use-${{ env.PRODUCT }}
          path: ${{ runner.temp }}/continued-use/*.json
          retention-days: 7
          if-no-files-found: warn
