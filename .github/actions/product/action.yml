name: Prepare the frozen product
description: Check out the exact candidate and install its locked dependencies
inputs:
  sha:
    description: Candidate commit immediately following the frozen baseline
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.sha }}
        path: product
        fetch-depth: 2
        persist-credentials: false
    - shell: bash
      working-directory: product
      run: |
        test "$(git rev-parse HEAD)" = "$PRODUCT"
        test "$(git show -s --format=%P HEAD)" = "$BASELINE"
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: product/package-lock.json
    - shell: bash
      working-directory: product
      run: npm ci > "$RUNNER_TEMP/npm.log" 2>&1
